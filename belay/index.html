<style>
/* Layout: guidebook topo — the mountain is the board (left), the pitch card is the play surface (right); stacks on phones. */
:root{
  --paper:#edf1f3; --panel:#f8fafb; --ink:#17222b; --muted:#5a6873; --line:#c9d2d9;
  --rock:#c3ccd3; --rock2:#d8dfe4; --snow:#ffffff; --sky:#e3e9ed;
  --rope:#dd4f22; --rope-soft:#f6d9cc; --rival:#2f64ad; --rival-soft:#d6e2f3;
  --good:#2b7d52; --warn:#b07a0c; --bad:#b9302f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e151b; --panel:#141e26; --ink:#e4ebf0; --muted:#8e9ca7; --line:#27343e;
  --rock:#22303a; --rock2:#1a252e; --snow:#3a4955; --sky:#111a21;
  --rope:#ff7444; --rope-soft:#3d2219; --rival:#6f9ee2; --rival-soft:#1b2a3d;
  --good:#58b884; --warn:#e0a83a; --bad:#ec6a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e151b; --panel:#141e26; --ink:#e4ebf0; --muted:#8e9ca7; --line:#27343e;
  --rock:#22303a; --rock2:#1a252e; --snow:#3a4955; --sky:#111a21;
  --rope:#ff7444; --rope-soft:#3d2219; --rival:#6f9ee2; --rival-soft:#1b2a3d;
  --good:#58b884; --warn:#e0a83a; --bad:#ec6a62; color-scheme:dark}

/* Embedded in itlist: match its deco-night palette, size to content */
:root[data-embed]{
  --paper:#100504; --panel:#190806; --ink:#F3D1A5; --muted:#B98768; --line:#3d1a10;
  --rock:#260B07; --rock2:#1a0805; --snow:#4a2416; --sky:#0c0403;
  --rope:#F18A3C; --rope-soft:#3a1708; --rival:#8fb3e8; --rival-soft:#16202e;
  --good:#7cc79a; --warn:#e6b450; --bad:#ff6a55; color-scheme:dark}
/* display face for titles: the BktList wordmark font, served from the site root */
@font-face{font-family:"Wonk";src:url("../OrbitLoungeWonk-Regular.woff2") format("woff2"),url("../OrbitLoungeWonk-Regular.ttf") format("truetype");font-display:swap}
:root{--title:"Wonk",Georgia,"Times New Roman",serif}
:root[data-embed],:root[data-embed] body{height:auto}
:root[data-embed] .brand{display:none}
:root[data-embed] .bar{border-bottom:0;padding-bottom:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rope);outline-offset:2px}
.app{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:1fr}}
#main.app{width:100%}

/* top bar */
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{font-family:var(--title);font-weight:400;font-size:30px;letter-spacing:.06em;line-height:1;margin:0;text-transform:uppercase}
.brand b{color:var(--rope)}
.bar .team{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.teamname{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.climbers{display:flex;gap:10px;font-size:13px;color:var(--muted)}
.climber{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.bar .spacer{flex:1}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}

/* stage */
.stage{position:relative;min-width:0}
.scene{position:relative;container-type:inline-size;border-radius:12px;overflow:hidden;background:#d8c7ac;box-shadow:0 1px 2px rgba(40,30,20,.08),0 10px 30px rgba(40,30,20,.14)}
.scene canvas{display:block;width:100%;aspect-ratio:16/10}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:14px}
.hud div{background:var(--panel);padding:8px 10px;min-width:0}
.hud .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hud .v{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .v.rival{color:var(--rival)}
@media (max-width:520px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ropes{display:inline-flex;gap:3px;vertical-align:middle}
.ropes i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--rope);display:inline-block}
.ropes i.used{border-color:var(--line)}

/* scene overlays: cinematic title cards and short captions over the painted canvas */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tcard{position:absolute;left:0;right:0;top:14%;text-align:center;color:#fff8ec;text-shadow:0 2px 22px rgba(40,20,10,.5),0 1px 2px rgba(40,20,10,.35);animation:tc 4s ease forwards}
.tcard i{display:block;font:italic 400 clamp(12px,2cqw,17px)/1.2 var(--title);letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.tcard b{display:block;font:400 clamp(34px,8cqw,72px)/1 var(--title);letter-spacing:.03em;margin:.1em 0 .18em}
.tcard small{display:inline-block;font:500 clamp(10px,1.6cqw,13px)/1 var(--body);letter-spacing:.24em;text-transform:uppercase;border-top:1px solid rgba(255,248,236,.65);padding-top:.7em}
@keyframes tc{0%{opacity:0;transform:translateY(12px);filter:blur(8px)}14%{opacity:1;transform:none;filter:none}80%{opacity:1;filter:none}100%{opacity:0;transform:translateY(-8px);filter:blur(4px)}}
.cap{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font:italic 400 clamp(14px,2.4cqw,19px)/1.2 var(--title);color:#fff8ec;
  text-shadow:0 1px 14px rgba(30,15,10,.65),0 1px 2px rgba(30,15,10,.4);white-space:nowrap;animation:cap 3s ease forwards}
@keyframes cap{0%{opacity:0;transform:translate(-50%,8px)}14%,76%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-4px)}}
@media (prefers-reduced-motion:reduce){.tcard,.cap{animation-name:fade}@keyframes fade{0%,100%{opacity:0}12%,80%{opacity:1}}}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.terrain{font-family:var(--title);font-weight:400;font-size:38px;line-height:1;letter-spacing:.04em;text-transform:uppercase;margin:8px 0 4px}
.rule{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:62ch}
.role{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:3px}
.role.lead{background:var(--rope);color:var(--panel)}
.role.belay{border:1px solid var(--ink)}
.prompt{font-size:22px;font-weight:600;line-height:1.3;margin:4px 0 14px;text-wrap:balance}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
input[type=text],input[type=number]{background:var(--paper);border:1.5px solid var(--line);border-radius:5px;padding:10px 12px;font-size:16px;width:100%}
input:focus{border-color:var(--ink);outline:none}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:5px;padding:10px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.rope{background:var(--rope);color:#fff}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 6px}
.timer i{display:block;height:100%;background:var(--rope);width:100%;transition:width .5s linear}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.wait{margin-top:12px;padding:10px 12px;border:1px dashed var(--line);border-radius:5px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:13px;padding:3px 8px;border-radius:3px;background:var(--rope-soft)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.sel{border-color:var(--rope);background:var(--rope-soft)}
.opt.correct{border-color:var(--good)}
.clue{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:.04em;color:var(--rope);text-transform:uppercase}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}

/* reveal */
.headline{font-family:var(--title);font-weight:400;font-size:30px;line-height:1.05;letter-spacing:.03em;margin:6px 0 10px;text-wrap:balance;
  transform-origin:left center;animation:hl-pop .5s cubic-bezier(.2,1.7,.45,1) both}
@keyframes hl-pop{from{transform:scale(.6) rotate(-3deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.headline{animation:none}}
.headline.good{color:var(--good)} .headline.bad{color:var(--bad)} .headline.warn{color:var(--warn)}
.lines{display:grid;gap:6px;margin:10px 0 14px}
.line{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.line .who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .what{font-weight:500;overflow-wrap:anywhere}
.tag{font-size:12px;font-family:var(--mono);white-space:nowrap}
.tag.ok{color:var(--good)} .tag.no{color:var(--bad)}
.rar{letter-spacing:2px;color:var(--rope)}
.moves{font-size:14px;display:grid;gap:4px;margin-bottom:14px}
.moves .r{color:var(--rival)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* camp */
.routes{display:grid;gap:10px;margin:12px 0}
.route{border:1.5px solid var(--line);border-radius:6px;padding:12px;background:var(--paper);text-align:left;cursor:pointer;display:grid;gap:4px}
.route:hover{border-color:var(--ink)}
.route.sel{border-color:var(--rope);background:var(--rope-soft)}
.route h4{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.03em}
.route .pp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.votes{font-size:13px;color:var(--muted)}

/* lobby */
.lobby{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:880px){.lobby{grid-template-columns:1fr}}
.hero h2{font-family:var(--display);font-size:44px;line-height:1;margin:8px 0 8px;letter-spacing:.01em;text-wrap:balance}
.hero p{color:var(--muted);max-width:60ch;margin:0 0 12px}
.cards{display:grid;gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;align-content:start}
.card h3{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;border:1.5px solid var(--line);border-radius:5px;padding:8px;background:var(--paper);cursor:pointer;text-align:left;font-size:13px}
.seg button b{display:block;font-size:14px}
.seg button.sel{border-color:var(--rival);background:var(--rival-soft)}
.teams{display:grid;gap:6px}
.teamrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
.teamrow:hover{border-color:var(--ink)}
.teamrow span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.note strong{color:var(--ink)}
.terrains{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px}
.terrains div{border-top:2px solid var(--ink);padding-top:6px;font-size:13px;color:var(--muted)}
.terrains b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.log{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.log h5{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.log ol{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:180px;overflow:auto;font-size:13px}
.log li{color:var(--muted)} .log li b{color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:5px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){.timer i{transition:none}}
</style>
</head>

const SEG0 = ["slab","crevasse","chimney","traverse","overhang","slab"];
const FORKS = [
 {camp:"Camp I", A:{name:"The Icefall",desc:"Direct and steep. Fewer pitches, more teamwork.",p:["chimney","overhang","crevasse","chimney","overhang"]},
                 B:{name:"Shoulder Ridge",desc:"Longer, gentler. More knowledge, less telepathy.",p:["slab","traverse","slab","crevasse","slab","traverse","chimney"]}},
 {camp:"Camp II",A:{name:"Summit Couloir",desc:"Four hard pitches straight to the top.",p:["overhang","chimney","crevasse","chimney"]},
                 B:{name:"North Ridge",desc:"Six pitches along the exposed ridge.",p:["slab","traverse","crevasse","slab","overhang","chimney"]}}
];

const RIVALS = {
 tourists:{name:"The Tourists",desc:"Slow and steady. Never falls."},

 soloist:{name:"The Soloist",desc:"Fast and reckless. Falls hard."}

/* ============================== MATCHING ============================== */
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/ø/g,"o").replace(/æ/g,"ae").replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ")
  .replace(/\b(the|a|an)\b/g," ").replace(/\s+/g," ").trim();
function parseEntries(str,tier){
  return str.split(";").map(e=>{const al=e.split("|").map(x=>x.trim()).filter(Boolean);
    const pretty=al.find(x=>/[^\x00-\x7f]/.test(x)&&norm(x)===norm(al[0]))||al[0];
    const label=pretty.replace(/(^|[\s-])(\S)/g,(m,a,b)=>a+b.toUpperCase());
    return {canon:al[0],label,keys:[...new Set(al.map(norm))],tier};});
}
RARE.forEach(p=>{p.entries=[];for(const k of [1,2,3,4,5]) p.entries.push(...parseEntries(p.t[k],k));});
LISTS.forEach(l=>{l.entries=parseEntries(l.items,1);});
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];}
function matchEntry(entries,input){
  const k=norm(input); if(!k) return null;
  const variants=[k,k.replace(/s$/,""),k+"s",k.replace(/ (cheese|dog|breed|city|town)$/,"")];
  let best=null,bd=99;
  for(const e of entries){for(const key of e.keys){
    if(variants.includes(key)) return e;
    const lim=key.length>=9?2:key.length>=5?1:0; if(!lim) continue;
    const d=lev(k,key); if(d<=lim&&d<bd){bd=d;best=e;}
  }}
  return best;
}
const dots = t => "●".repeat(t)+"○".repeat(5-t);

/* Firebase REST + streaming (EventSource) — no SDK needed */
const fb={
  url:p=>`${FB}/${p}.json`,
  async get(p){const r=await fetch(fb.url(p));if(!r.ok)throw new Error("get "+r.status);return r.json();},
  async getTagged(p){
    try{const r=await fetch(fb.url(p),{headers:{"X-Firebase-ETag":"true"}});if(!r.ok)throw 0;return {val:await r.json(),etag:r.headers.get("ETag")};}
    catch(e){return {val:await fb.get(p),etag:null};}},
  async put(p,v,etag){const h={"Content-Type":"application/json"};if(etag)h["if-match"]=etag;
    const r=await fetch(fb.url(p),{method:"PUT",headers:h,body:JSON.stringify(v)});
    if(r.status===412)return false;if(!r.ok)throw new Error("put "+r.status);return true;},
  async patch(p,v){const r=await fetch(fb.url(p),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});if(!r.ok)throw new Error("patch "+r.status);},
  del(p){return fetch(fb.url(p),{method:"DELETE"}).catch(()=>{});},
  listen(p,cb){
    let tree=null;const es=new EventSource(fb.url(p));
    const isObj=x=>x&&typeof x==="object";
    const apply=(ev,isPatch)=>{let d;try{d=JSON.parse(ev.data);}catch(e){return;}if(!d||typeof d.path!=="string")return;
      const parts=d.path.split("/").filter(Boolean);
      if(!parts.length&&!isPatch){tree=d.data;}
      else{
        if(!isObj(tree))tree={};let o=tree;
        const keys=isPatch?parts:parts.slice(0,-1);
        for(const k of keys){if(!isObj(o[k]))o[k]={};o=o[k];}
        if(isPatch){for(const [k,v] of Object.entries(d.data||{})){if(v===null)delete o[k];else o[k]=v;}}
        else{const k=parts[parts.length-1];if(d.data===null)delete o[k];else o[k]=d.data;}
      }
      cb(tree==null?null:clone(tree));};
    es.addEventListener("put",e=>apply(e,false));
    es.addEventListener("patch",e=>apply(e,true));
    return ()=>es.close();}
};
/* Firebase drops empty arrays/objects and nulls; restore the shape the game expects */
function fixTeam(t){
  if(!t||typeof t!=="object")return null;t=clone(t);
  t.members=t.members||{};t.log=Object.values(t.log||{});t.stats=t.stats||{};t.rival=t.rival||"twins";
  const e=t.exp=t.exp||newExp(1);const c=e.choice||{};e.choice=[c[0]||null,c[1]||null];
  e.used=Object.values(e.used||{});e.rival=e.rival||{alt:ALT.base,camp:ALT.base};
  for(const k of ["pitch","anchor","rope"])e[k]=e[k]||0;
  t.round=t.round||{id:0,phase:"ready"};t.round.id=t.round.id||0;t.round.votes=t.round.votes||{};
  if(t.round.result)t.round.result.lines=Object.values(t.round.result.lines||{});
  return t;
}

/* ============================== ROUTE MATH ============================== */
function lens(exp){return [SEG0.length, exp.choice[0]?FORKS[0][exp.choice[0]].p.length:null, exp.choice[1]?FORKS[1][exp.choice[1]].p.length:null];}
function route(exp){let r=[...SEG0];if(exp.choice[0])r=r.concat(FORKS[0][exp.choice[0]].p);if(exp.choice[1])r=r.concat(FORKS[1][exp.choice[1]].p);return r;}
function total(exp){const L=lens(exp);return L[0]+(L[1]||0)+(L[2]||0);}
function campStops(exp){const L=lens(exp);const s=[L[0]];if(L[1])s.push(L[0]+L[1]);if(L[1]&&L[2])s.push(L[0]+L[1]+L[2]);return s;}
function altOf(exp,p){const L=lens(exp);
  if(p<=L[0])return ALT.base+(ALT.c1-ALT.base)*p/L[0];
  if(L[1]&&p<=L[0]+L[1])return ALT.c1+(ALT.c2-ALT.c1)*(p-L[0])/L[1];
  if(L[2])return ALT.c2+(ALT.top-ALT.c2)*(p-L[0]-L[1])/L[2];
  return ALT.c2;}
function needsChoice(exp){const L=lens(exp);
  if(exp.pitch===L[0]&&!exp.choice[0])return 0;
  if(L[1]&&exp.pitch===L[0]+L[1]&&!exp.choice[1])return 1;
  return -1;}
function nextStop(exp){const L=lens(exp);if(exp.pitch<L[0])return L[0];
  if(L[1]&&exp.pitch<L[0]+L[1])return L[0]+L[1];return total(exp);}
function newExp(n,prev){return {n,choice:[null,null],pitch:0,anchor:0,rope:3,rival:{alt:ALT.base,camp:ALT.base},rivalTop:false,used:prev?prev.used.slice(-40):[]};}

/* ============================== QUESTION PICK ============================== */
function poolFor(terrain){return terrain==="slab"||terrain==="chimney"?RARE:terrain==="traverse"?LISTS:terrain==="crevasse"?EST:MCQ;}
function pickQ(terrain,used){const pool=poolFor(terrain);let fresh=pool.filter(q=>!used.includes(q.id));
  if(!fresh.length)fresh=pool;return fresh[Math.floor(Math.random()*fresh.length)].id;}
function qById(terrain,id){return poolFor(terrain).find(q=>q.id===id);}

/* ============================== RIVAL ============================== */
function rivalStep(kind,r){r=clone(r);let note;
  const camps=[ALT.c1,ALT.c2];
  if(kind==="tourists"){const m=70+Math.random()*40;r.alt+=m;note=`climbed ${Math.round(m)} m`;}
  else if(kind==="twins"){const x=Math.random();const m=x<.15?0:x<.65?85:165;r.alt+=m;note=m?`climbed ${m} m`:"stalled";}
  else{if(Math.random()<.17&&r.alt>r.camp+40){note=`fell ${Math.round(r.alt-r.camp)} m to ${r.camp===ALT.base?"the base":"camp"}`;r.alt=r.camp;}
       else{const m=115+Math.random()*80;r.alt+=m;note=`climbed ${Math.round(m)} m`;}}
  r.alt=Math.min(r.alt,ALT.top);for(const c of camps)if(r.alt>=c)r.camp=Math.max(r.camp,c);
  return {r,note};}

/* ============================== JUDGING ============================== */
async function llmJudge(prompt,answers){
  if(!S.sample||!answers.length)return null;
  const input=`You judge answers in a trivia game. The prompt was: "${prompt}".
For each submitted answer decide:
- valid: true only if it is a real, correct answer to the prompt (forgive spelling mistakes and Swedish/English name variants; reject jokes, made-up names and wrong categories)
- canonical: the standard English name of the thing
- rarity: 1 to 5, where 1 = among the first things most people would say and 5 = only an expert would think of it
Answers: ${JSON.stringify(answers)}
Reply with JSON only: {"results":[{"answer":"...","valid":true,"canonical":"...","rarity":3}]}`;
  try{const r=await S.sample.json(input,{modelTier:"quick"});return Array.isArray(r?.results)?r.results:null;}
  catch(e){return null;}
}
async function judgeRare(q,texts){ // texts: array of strings -> array of {text,valid,tier,canon,src}
  const out=texts.map(t=>{if(!t||!norm(t))return {text:t||"",valid:false,tier:0,canon:"",src:"empty"};
    const e=matchEntry(q.entries,t);return e?{text:t,valid:true,tier:e.tier,canon:norm(e.canon),label:e.label,src:"list"}:{text:t,valid:null};});
  const unknown=[...new Set(out.filter(o=>o.valid===null).map(o=>o.text))];
  if(unknown.length){const res=await llmJudge(q.q,unknown);
    for(const o of out){if(o.valid!==null)continue;
      const r=res?.find(x=>norm(x.answer)===norm(o.text));
      if(r&&r.valid){o.valid=true;o.tier=Math.max(1,Math.min(5,Math.round(r.rarity||4)));o.canon=norm(r.canonical||o.text);o.label=r.canonical||o.text;o.src="judge";}
      else{o.valid=false;o.tier=0;o.canon="";o.src=res?"judge":"unverified";}}}
  return out;
}
function tagFor(o){if(o.src==="empty")return '<span class="tag no">no answer</span>';
  if(!o.valid)return `<span class="tag no">${o.src==="unverified"?"not on our list":"not valid"}</span>`;
  return `<span class="tag ok"><span class="rar" aria-label="rarity ${o.tier} of 5">${dots(o.tier)}</span></span>`;}

async function judge(t,ans){
  const r=t.round,ids=memberIds(t),leader=r.leader,bel=ids.find(i=>i!==leader);
  const q=qById(r.terrain,r.qid);const o={move:0,fall:false,lines:[],headline:"",tone:"good"};
  const A=id=>id?ans[id]:null;
  if(r.terrain==="slab"){
    const [L,B]=await judgeRare(q,[A(leader)?.text,bel?A(bel)?.text:""]);
    o.lines.push({who:leader,text:L.label||L.text,tag:tagFor(L)});
    if(bel)o.lines.push({who:bel,text:B.label||B.text,tag:tagFor(B),note:"backup"});
    if(L.valid){o.move=L.tier>=4?2:1;o.headline=L.tier>=4?"Rare hold. Two pitches.":"Clean lead. One pitch.";o.best=[L,leader];}
    else if(B.valid){o.move=0;o.headline="The belay held.";o.tone="warn";o.detail="The backup was good, so no fall, but no height either.";}
    else{o.fall=true;o.headline="Leader fall!";o.tone="bad";}
  }
  else if(r.terrain==="chimney"){
    const texts=ids.map(id=>A(id)?.text||"");const res=await judgeRare(q,texts);
    ids.forEach((id,i)=>o.lines.push({who:id,text:res[i].label||res[i].text,tag:tagFor(res[i])}));
    const valid=res.filter(x=>x.valid);
    if(ids.length===1){if(valid.length){o.move=valid[0].tier>=4?2:1;o.headline="Solo bridging. You moved up.";o.best=[valid[0],ids[0]];}else{o.fall=true;o.headline="You slipped out of the chimney.";o.tone="bad";}}
    else if(valid.length===2&&res[0].canon===res[1].canon){
      if(valid[0].tier>=3){o.move=2;o.echo=true;o.headline=`Echo! You both said ${valid[0].label}.`;o.best=[valid[0],ids[0]];}
      else{o.fall=true;o.headline=`Collision. You both said ${valid[0].label}.`;o.tone="bad";o.detail="Too obvious to share. Same answer, nothing to brace against.";}}
    else if(valid.length===2){o.move=1;o.headline="Good bracing. One pitch.";const b=res[0].tier>=res[1].tier?0:1;o.best=[res[b],ids[b]];}
    else if(valid.length===1){o.move=0;o.headline="One foot slipped. You hold position.";o.tone="warn";}
    else{o.fall=true;o.headline="Both feet gone.";o.tone="bad";}
  }
  else if(r.terrain==="crevasse"){
    const nums=ids.map(id=>A(id)?.num).filter(v=>typeof v==="number"&&isFinite(v));
    ids.forEach(id=>{const v=A(id)?.num;o.lines.push({who:id,text:typeof v==="number"?fmt(v)+" "+q.u:"no guess",tag:""});});
    if(!nums.length){o.fall=true;o.headline="Nobody jumped.";o.tone="bad";}
    else{const avg=nums.reduce((a,b)=>a+b,0)/nums.length;const err=Math.abs(avg-q.a);
      o.lines.push({who:null,text:`Average ${fmt(avg)} · answer ${fmt(q.a)} ${q.u}`,tag:`<span class="tag ${err<=q.t[1]?"ok":"no"}">off by ${fmt(err)}</span>`});
      if(err<=q.t[0]){o.move=2;o.headline="Dead centre of the bridge.";}
      else if(err<=q.t[1]){o.move=1;o.headline="Made the jump.";}
      else{o.fall=true;o.headline="Into the crevasse.";o.tone="bad";}}
  }
  else if(r.terrain==="traverse"){
    const sets=ids.map(id=>{const m=new Map();for(const it of (A(id)?.list||[])){const e=matchEntry(q.entries,it);if(e)m.set(e.canon,true);}return [...m.keys()];});
    const all=new Set(sets.flat());const shared=sets.length===2?sets[0].filter(x=>sets[1].includes(x)):[];
    const score=all.size-shared.length;
    ids.forEach((id,i)=>{const n=(A(id)?.list||[]).length;o.lines.push({who:id,text:`${sets[i].length} correct of ${n}`,tag:""});});
    o.lines.push({who:null,text:`${all.size} unique, ${shared.length} doubled${shared.length?": "+shared.slice(0,6).join(", "):""}`,tag:`<span class="tag ${score>=q.pass?"ok":"no"}">${score} / ${q.pass} needed</span>`});
    if(score>=q.great){o.move=2;o.headline=`Flawless traverse. ${score} holds.`;}
    else if(score>=q.pass){o.move=1;o.headline=`Across. ${score} holds.`;}
    else{o.fall=true;o.headline=`Ran out of holds at ${score}.`;o.tone="bad";}
    const missed=q.entries.filter(e=>!all.has(e.canon)).map(e=>e.label);
    if(missed.length)o.detail="Some you missed: "+missed.sort(()=>Math.random()-.5).slice(0,5).join(", ")+".";
  }
  else if(r.terrain==="overhang"){
    const ch=A(leader)?.choice;const clue=bel?A(bel)?.clue:null;
    o.lines.push({who:bel||null,text:clue?`Clue: “${clue}”`:"No clue sent",tag:""});
    const picked=typeof ch==="number"&&ch>=0&&ch<q.o.length;
    o.lines.push({who:leader,text:picked?q.o[ch]:"no pick",tag:`<span class="tag ${ch===q.c?"ok":"no"}">${ch===q.c?"correct":"wrong"}</span>`});
    o.detail=`${q.q} Answer: ${q.o[q.c]}.`;
    if(ch===q.c){o.move=1;o.headline="Pulled over the roof.";}else{o.fall=true;o.headline="Off the overhang!";o.tone="bad";}
  }
  return o;
}

function applyOutcome(t,o){
  const exp=clone(t.exp);const before=exp.pitch;const beforeAlt=altOf(exp,before);let moveText="";
  if(o.fall){
    if(exp.rope>0){exp.rope--;o.caught=true;moveText=`Rope caught you. ${exp.rope} rope${exp.rope===1?"":"s"} left.`;if(o.tone==="bad")o.tone="warn";}
    else{exp.pitch=exp.anchor;moveText=exp.pitch<before?`No rope left. Fell ${Math.round(beforeAlt-altOf(exp,exp.pitch))} m to your anchor.`:"No rope left, but you were at your anchor.";}
  }else if(o.move>0){
    exp.pitch=Math.min(exp.pitch+o.move,nextStop(exp));
    moveText=`Up ${Math.round(altOf(exp,exp.pitch)-beforeAlt)} m to ${fmt(altOf(exp,exp.pitch))} m.`;
  }else moveText="Holding position.";
  const stops=campStops(exp);let arrived=null;
  if(exp.pitch>before&&stops.includes(exp.pitch)){
    exp.anchor=exp.pitch;exp.rope=3;
    if(exp.pitch===total(exp)&&exp.choice[1])arrived="summit";else arrived=exp.pitch===lens(exp)[0]?"Camp I":"Camp II";
  }
  const rs=rivalStep(t.rival,exp.rival);exp.rival=rs.r;
  let rivalNote=`${RIVALS[t.rival].name} ${rs.note}, now at ${fmt(exp.rival.alt)} m.`;
  if(exp.rival.alt>=ALT.top&&!exp.rivalTop){exp.rivalTop=true;rivalNote=`${RIVALS[t.rival].name} reached the summit.`;}
  const stats=clone(t.stats||{});stats.rounds=(stats.rounds||0)+1;
  if(o.echo)stats.echoes=(stats.echoes||0)+1;
  if(o.fall&&!o.caught)stats.falls=(stats.falls||0)+1;
  if(o.best){const [b,who]=o.best;const q=qById(t.round.terrain,t.round.qid);
    if(b.tier>=4&&(!stats.best||b.tier>=stats.best.tier))stats.best={answer:b.label||b.text,tier:b.tier,prompt:q.q,by:who};}
  if(arrived==="summit"){exp.finished=t.exp.rivalTop?"second":"won";stats.summits=(stats.summits||0)+1;if(exp.finished==="won")stats.wins=(stats.wins||0)+1;}
  const log=(t.log||[]).slice(-39);
  const tname=TERRAIN[t.round.terrain].name;
  log.push({at:Date.now(),text:`P${before+1} ${tname}: ${o.headline}`});
  if(arrived)log.push({at:Date.now(),text:arrived==="summit"?(exp.finished==="won"?"Summit first! Expedition won.":"Summit, after the rival."):`Reached ${arrived}. Rope restocked, anchor set.`});
  const result={...o,moveText,rivalNote,arrived,from:before,to:exp.pitch};
  delete result.best;
  return {...t,exp,stats,log,round:{...t.round,phase:"reveal",result,resolvedAt:Date.now()}};
}

/* ============================== ACTIONS ============================== */
async function guarded(fn){
  if(S.acting)return;S.acting=true;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const {val,etag}=await fb.getTagged("teams/"+S.code);const t=fixTeam(val);if(!t)return;
      const next=await fn(t);if(!next)return;
      if(await fb.put("teams/"+S.code,next,etag))return;
    }
  }catch(e){console.error(e);toast("Couldn't save that move. Check your connection and try again.");}
  finally{S.acting=false;}
}
function startAnswerRound(t){
  const ids=memberIds(t);const id=(t.round?.id||0)+1;const exp=t.exp;
  const c=needsChoice(exp);
  if(exp.pitch>=total(exp)&&exp.choice[1])return {...t,round:{id,phase:"summit"}};
  if(c>=0)return {...t,round:{id,phase:"camp",fork:c,votes:{}}};
  const terrain=route(exp)[exp.pitch];const qid=pickQ(terrain,exp.used);
  exp.used=[...exp.used,qid].slice(-60);
  return {...t,exp,round:{id,phase:"answer",terrain,qid,leader:ids[id%ids.length],startedAt:Date.now(),dur:TERRAIN[terrain].dur}};
}
function advance(withAnchor){
  const rid=S.team.round.id;
  guarded(t=>{
    if(t.round.id!==rid)return null;
    if(withAnchor&&t.round.phase==="reveal"&&t.exp.anchor!==t.exp.pitch){
      t.exp.anchor=t.exp.pitch;const rs=rivalStep(t.rival,t.exp.rival);t.exp.rival=rs.r;
      if(t.exp.rival.alt>=ALT.top)t.exp.rivalTop=true;
      t.log=t.log.slice(-39);t.log.push({at:Date.now(),text:`Anchor placed at ${fmt(altOf(t.exp,t.exp.pitch))} m. ${RIVALS[t.rival].name} ${rs.note}.`});}
    return startAnswerRound(t);});
}
function setOff(choice){
  const rid=S.team.round.id;
  guarded(t=>{if(t.round.id!==rid||t.round.phase!=="camp")return null;
    const f=t.round.fork;t.exp.choice[f]=choice;t.exp.anchor=t.exp.pitch;
    t.log=t.log.slice(-39);t.log.push({at:Date.now(),text:`Set off from ${FORKS[f].camp} on ${FORKS[f][choice].name}.`});
    return startAnswerRound(t);});
}
function newExpedition(){
  const rid=S.team.round.id;
  guarded(t=>{if(t.round.id!==rid)return null;
    t.exp=newExp((t.exp?.n||1)+1,t.exp);t.log=t.log.slice(-39);t.log.push({at:Date.now(),text:`Expedition ${t.exp.n} begins at base camp.`});
    return {...t,round:{id:rid+1,phase:"ready"}};});
}
async function vote(choice){
  try{await fb.patch(`teams/${S.code}/round/votes`,{[S.uid]:choice});}catch(e){toast("Couldn't save your vote.");}
}
async function submit(payload){
  const r=S.team.round;if(r.phase!=="answer")return;
  try{await fb.put(`answers/${S.code}/${r.id}/${S.uid}`,{roundId:r.id,uid:S.uid,at:Date.now(),...payload});}
  catch(e){toast("Couldn't send your answer. Check your connection.");}
}
async function tryResolve(){
  if(S.resolving||!S.team)return;const rid=S.team.round.id;S.resolving=true;
  try{
    const {val,etag}=await fb.getTagged("teams/"+S.code);const t=fixTeam(val);
    if(!t||t.round.id!==rid||t.round.phase!=="answer")return;
    const ans=(await fb.get(`answers/${S.code}/${rid}`))||{};
    const o=await judge(t,ans);
    const ok=await fb.put("teams/"+S.code,applyOutcome(t,o),etag);
    if(ok)fb.del(`answers/${S.code}/${rid-2}`);
  }catch(e){console.error(e);}
  finally{S.resolving=false;}
}

function rememberTeam(code,name){

}
function readName(){const el=$("#myname");const v=((el?el.value:S.myName)||"").trim().slice(0,24);if(v){S.myName=v;LS.set("name",v);}return v;}

async function createTeam(){
  const err=$("#createErr");const me=readName();if(!me){err.textContent="Add your name first.";$("#myname").focus();return;}
  const name=($("#tname").value||"").trim()||"Rope Team";const code=randCode();
  const btn=$("#createBtn");btn.disabled=true;
  const t={name,code,createdAt:Date.now(),createdBy:S.uid,members:{[S.uid]:{name:me,joined:Date.now()}},rival:lobbyRival,
    exp:newExp(1),round:{id:0,phase:"ready"},log:[{at:Date.now(),text:`${name} roped up at base camp, ${fmt(ALT.base)} m.`}],stats:{rounds:0,summits:0,wins:0,echoes:0,falls:0}};
  try{await fb.put("teams/"+code,t);rememberTeam(code,name);openTeam(code);}
  catch(e){err.textContent="Couldn't create the team. Check your connection and try again.";btn.disabled=false;}
}
async function joinTeam(){
  const code=($("#jcode").value||"").trim().toUpperCase();const err=$("#joinErr");err.textContent="";$("#seats").innerHTML="";
  if(!/^[A-Z0-9]{6}$/.test(code)){err.textContent="Team codes are 6 letters and digits.";return;}
  const me=readName();if(!me){err.textContent="Add your name first.";$("#myname").focus();return;}
  try{
    const {val,etag}=await fb.getTagged("teams/"+code);const t=fixTeam(val);
    if(!t){err.textContent="No rope team with that code.";return;}
    const ids=Object.keys(t.members);
    if(ids.includes(S.uid)){rememberTeam(code,t.name);openTeam(code);return;}
    if(ids.length>=2){
      err.textContent="This rope team already has two climbers. Playing on a new device? Take over your own place:";
      $("#seats").innerHTML=`<div class="actions" style="margin-top:8px">${ids.map(id=>`<button class="btn ghost" data-id="${esc(id)}">I'm ${esc(t.members[id].name||"this climber")}</button>`).join("")}</div>`;
      $("#seats").querySelectorAll("button").forEach(b=>b.onclick=()=>takeSeat(code,b.dataset.id));
      return;}
    t.members[S.uid]={name:me,joined:Date.now()};
    t.log=t.log.slice(-39);t.log.push({at:Date.now(),text:`${me} clipped into the rope.`});
    if(!(await fb.put("teams/"+code,t,etag))){err.textContent="The team just changed. Press Join again.";return;}
    rememberTeam(code,t.name);openTeam(code);
  }catch(e){err.textContent="Couldn't join. Check your connection and try again.";}
}
async function takeSeat(code,old){
  const err=$("#joinErr");
  try{const {val,etag}=await fb.getTagged("teams/"+code);const t=fixTeam(val);if(!t||!t.members[old])return;
    const m=t.members[old];delete t.members[old];t.members[S.uid]={...m,name:readName()||m.name};
    if(t.round.leader===old)t.round.leader=S.uid;
    if(t.round.votes[old]){t.round.votes[S.uid]=t.round.votes[old];delete t.round.votes[old];}
    if(!(await fb.put("teams/"+code,t,etag))){err.textContent="The team just changed. Try again.";return;}
    rememberTeam(code,t.name);openTeam(code);
  }catch(e){err.textContent="Couldn't take over that place. Try again.";}
}

/* ============================== GAME SESSION ============================== */
function closeTeam(){
  S.unsubTeam?.();S.unsubAns?.();S.unsubPres?.();clearInterval(S.presTimer);
  S.unsubTeam=S.unsubAns=S.unsubPres=null;S.team=null;S.code=null;S.answers={};S.ansRound=null;S.panelKey=null;S.online=new Set();S.pres={};
}
function goLobby(){closeTeam();try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}renderLobby();}
function beat(){if(S.code&&document.visibilityState==="visible")fb.put(`presence/${S.code}/${S.uid}`,Date.now()).catch(()=>{});}
document.addEventListener("visibilitychange",beat);
function updateOnline(){const now=Date.now();S.online=new Set(Object.entries(S.pres||{}).filter(([,v])=>now-v<60000).map(([k])=>k));if(S.team)renderBar();}
function openTeam(code){
  closeTeam();S.code=code;try{history.replaceState(null,"","#t-"+code);}catch(e){}
  const main=$("#main");main.className="";main.innerHTML=`<div class="panel"><p class="note">Clipping in…</p></div>`;
  let first=true;
  S.unsubTeam=fb.listen("teams/"+code,raw=>{
    const t=fixTeam(raw);
    if(!t||!t.members[S.uid]){if(first||S.team){toast(t?"You're not on this rope team.":"That rope team doesn't exist.");goLobby();}return;}
    first=false;S.team=t;S.names={};
    for(const [id,m] of Object.entries(t.members))S.names[id]=m.name||"Partner";
    if(t.round.id!==S.ansRound)subAnswers(t.round.id);
    render();
  });
  beat();S.presTimer=setInterval(beat,25000);
  S.unsubPres=fb.listen(`presence/${code}`,p=>{S.pres=p||{};updateOnline();});
}
function subAnswers(rid){
  S.unsubAns?.();S.ansRound=rid;S.answers={};
  S.unsubAns=fb.listen(`answers/${S.code}/${rid}`,a=>{S.answers=a||{};if(S.team)render();});
}

function renderHud(t){

function remaining(r){return Math.max(0,(r.startedAt+r.dur*1000-Date.now())/1000);}
function logHtml(t){const st=t.stats||{};
  return `<div class="log"><h5>Expedition ${t.exp.n} · ${st.summits||0} summit${st.summits===1?"":"s"} · ${st.echoes||0} echoes${st.best?` · rarest: ${esc(st.best.answer)}`:""}</h5><ol>${(t.log||[]).slice().reverse().slice(0,14).map(l=>`<li><b>${new Date(l.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</b> ${esc(l.text)}</li>`).join("")}</ol></div>`;}

function renderPanel(t){
  const r=t.round;const panel=$("#panel");const mine=S.answers[S.uid];

function readyView(t){
  const ids=memberIds(t);
  return `<div class="eyebrow">Base camp · ${fmt(ALT.base)} m</div>
   <div class="terrain">Expedition ${t.exp.n}</div>
   <p class="rule">${ids.length<2?`Send your partner the invite link from the top bar (or the code <strong>${esc(t.code)}</strong>). You can start alone, but the Chimney and Overhang play best with two.`:"Both climbers are on the rope. Leader and belayer swap every pitch."} The first pitch is a ${TERRAIN[SEG0[0]].name}.</p>

function answerView(t,mine){
  const r=t.round,q=qById(r.terrain,r.qid),T=TERRAIN[r.terrain];

  if(r.terrain==="slab"||r.terrain==="chimney"){
    body=`<div class="prompt">${esc(q.q)}</div><div class="row"><input type="text" id="ans" maxlength="60" autocomplete="off" placeholder="${r.terrain==="slab"&&!lead?"Your backup answer":"Your answer"}" aria-label="Your answer"><button class="btn rope" id="sendBtn">Lock in</button></div>`;
  }else if(r.terrain==="crevasse"){
    body=`<div class="prompt">${esc(q.q)}</div><div class="row"><input type="number" id="ans" inputmode="decimal" placeholder="Your estimate${q.u?" ("+q.u+")":""}" aria-label="Your estimate"><button class="btn rope" id="sendBtn">Jump</button></div>`;
  }else if(r.terrain==="traverse"){
    body=`<div class="prompt">${esc(q.q)}</div><div class="row"><input type="text" id="ans" maxlength="40" autocomplete="off" placeholder="Type one, press Enter" aria-label="Add an answer"><button class="btn ghost" id="addBtn">Add</button></div>
     <div class="chips" id="chips"></div><div style="margin-top:12px"><button class="btn rope" id="sendBtn">Done, lock in my list</button></div>`;
  }else if(r.terrain==="overhang"){
    if(solo){body=`<div class="prompt">${esc(q.q)}</div><div class="opts">${q.o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x)}</button>`).join("")}</div>`;}
    else if(lead){body=`<div class="prompt">Category: ${esc(q.cat)}</div><div class="wait" id="clueBox">Waiting for your belayer's clue…</div><div class="opts" style="margin-top:12px">${shuffleIdx(q.o.length,r.id).map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>`;}
    else{body=`<div class="prompt">${esc(q.q)}</div><div class="opts">${q.o.map((x,i)=>`<button class="opt ${i===q.c?"correct":""}" disabled>${esc(x)}${i===q.c?" ✓":""}</button>`).join("")}</div>
      <p class="rule" style="margin-top:12px">Your leader sees only the four options. Send one word that points to the right one. Words from the options are not allowed.</p>
      ${mine?`<div class="wait">Clue sent: <strong>${esc(mine.clue)}</strong></div>`:`<div class="row"><input type="text" id="ans" maxlength="20" autocomplete="off" placeholder="One-word clue" aria-label="One-word clue"><button class="btn rope" id="sendBtn">Send clue</button></div>`}`;}
  }
  return head+body+`<div class="err" id="ansErr"></div>`+foot;
}
function promptText(r,q,lead,solo){return r.terrain==="overhang"&&lead&&!solo?"Category: "+q.cat:q.q;}
function answerSummary(terrain,a,q){
  if(terrain==="crevasse")return fmt(a.num)+(q.u?" "+q.u:"");
  if(terrain==="traverse")return (a.list||[]).length+" answers";
  if(terrain==="overhang")return typeof a.choice==="number"?q.o[a.choice]:a.clue||"";
  return a.text||"(blank)";}
function shuffleIdx(n,seed){const a=[...Array(n).keys()];let s=seed*9301+49297;for(let i=n-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function revealView(t){
  const o=t.round.result||{};const q=qById(t.round.terrain,t.round.qid);
  const nextIsCamp=needsChoice(t.exp)>=0;const atTop=t.exp.pitch>=total(t.exp)&&t.exp.choice[1];

   ${o.detail?`<p class="rule">${esc(o.detail)}</p>`:""}
   <div class="lines">${(o.lines||[]).map(l=>`<div class="line"><span class="who">${l.who?esc(nameOf(l.who))+(l.note?" · "+l.note:""):"Team"}</span><span class="what">${esc(l.text)}</span>${l.tag||"<span></span>"}</div>`).join("")}</div>
   <div class="moves"><div><b>${esc(o.moveText||"")}</b></div>${o.arrived&&o.arrived!=="summit"?`<div>Reached ${esc(o.arrived)}. Anchor set and rope restocked.</div>`:""}<div class="r">${esc(o.rivalNote||"")}</div></div>
   <div class="actions">${atTop?`<button class="btn rope" id="nextBtn">Stand on the summit</button>`:nextIsCamp?`<button class="btn rope" id="nextBtn">Rest at camp</button>`:`<button class="btn rope" id="nextBtn">Climb on</button>${canAnchor?`<button class="btn ghost" id="anchorBtn" title="Locks this height, but the rival gets a free move">Place anchor, then climb</button>`:""}`}</div>`;
}
function campView(t){
  const f=FORKS[t.round.fork];const votes=t.round.votes||{};const ids=memberIds(t);
  const lead=ids[t.round.id%ids.length]===S.uid||ids.length<2;const my=votes[S.uid];

function summitView(t){const st=t.stats||{};const won=t.exp.finished==="won";
  return `<div class="eyebrow">Summit · ${fmt(ALT.top)} m</div>
   <div class="terrain">${t.exp.rivalTop&&!won?"Summit, second place":"Summit first"}</div>
   <p class="rule">${t.exp.rivalTop&&!won?`${esc(RIVALS[t.rival].name)} got there before you. The mountain will be here next time.`:`You beat ${esc(RIVALS[t.rival].name)} to the top.`}</p>
   <div class="lines">
     <div class="line"><span class="who">Summits</span><span class="what">${st.summits||0} (${st.wins||0} won)</span><span></span></div>

     <div class="line"><span class="who">Pitches played</span><span class="what">${st.rounds||0}</span><span></span></div>
     ${st.best?`<div class="line"><span class="who">Rarest</span><span class="what">${esc(st.best.answer)} <span class="note">for “${esc(st.best.prompt)}”</span></span><span class="tag"><span class="rar">${dots(st.best.tier)}</span></span></div>`:""}
   </div>
   <button class="btn rope" id="newExpBtn">Start a new expedition</button>`;}

function wirePanel(t){
  const r=t.round;const P=$("#panel");
  P.querySelector("#goBtn")?.addEventListener("click",()=>advance(false));
  P.querySelector("#nextBtn")?.addEventListener("click",()=>advance(false));
  P.querySelector("#anchorBtn")?.addEventListener("click",()=>advance(true));
  P.querySelector("#newExpBtn")?.addEventListener("click",newExpedition);
  P.querySelectorAll(".route").forEach(b=>b.addEventListener("click",()=>vote(b.dataset.k)));
  P.querySelector("#setOffBtn")?.addEventListener("click",()=>{const v=(t.round.votes||{})[S.uid];if(v)setOff(v);});
  if(r.phase!=="answer")return;
  const inp=P.querySelector("#ans"),send=P.querySelector("#sendBtn"),err=P.querySelector("#ansErr");
  if(r.terrain==="traverse"&&inp){
    const add=()=>{const v=inp.value.trim();if(!v)return;if(!S.local.items.some(x=>norm(x)===norm(v)))S.local.items.push(v);inp.value="";drawChips();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
    P.querySelector("#addBtn").addEventListener("click",add);
    send.addEventListener("click",()=>{add();submit({list:S.local.items.slice(0,80)});});
  }else if(inp&&send){
    const go=()=>{const q=qById(r.terrain,r.qid);
      if(r.terrain==="crevasse"){const n=parseFloat(String(inp.value).replace(",","."));if(!isFinite(n)){err.textContent="Enter a number.";return;}submit({num:n});}
      else if(r.terrain==="overhang"){const c=norm(inp.value);
        if(!/^[a-z0-9]{2,20}$/.test(c.replace(/ /g,"_"))||c.includes(" ")){err.textContent="One word, letters only.";return;}
        const banned=q.o.flatMap(x=>norm(x).split(" ")).filter(w=>w.length>=3);
        if(banned.some(w=>c.includes(w)||w.includes(c)&&c.length>=4)){err.textContent="That word is in the options. Try another.";return;}
        submit({clue:inp.value.trim()});}
      else{if(!inp.value.trim()){err.textContent="Type an answer first.";return;}submit({text:inp.value.trim()});}};
    send.addEventListener("click",go);inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go();}});
    if(!matchMedia("(hover:none)").matches)inp.focus();
  }
  P.querySelectorAll(".opt[data-i]").forEach(b=>b.addEventListener("click",()=>{if(S.answers[S.uid])return;P.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b));submit({choice:+b.dataset.i});}));
  if(r.terrain==="traverse")drawChips();
}
function drawChips(){const c=$("#chips");if(!c)return;c.innerHTML=S.local.items.map(x=>`<span>${esc(x)}</span>`).join("");}

function requiredIds(t){const r=t.round;const ids=memberIds(t);return r.terrain==="overhang"?[r.leader]:ids;}
function updateDynamic(t){
  const r=t.round;if(r.phase!=="answer")return;
  const rem=remaining(r);const bar=$("#timerBar"),txt=$("#timerTxt"),ptx=$("#partnerTxt");
  if(bar)bar.style.width=(100*rem/r.dur)+"%";
  if(txt)txt.textContent=rem>0?`${Math.ceil(rem)} s`:"Time";
  const pid=partnerId(t);
  if(ptx)ptx.textContent=pid?(S.answers[pid]?`${nameOf(pid)} is locked in`:`${nameOf(pid)} is thinking…`):"";
  const cb=$("#clueBox");if(cb){const c=pid&&S.answers[pid]?.clue;cb.innerHTML=c?`Clue from ${esc(nameOf(pid))}: <span class="clue">${esc(c)}</span>`:"Waiting for your belayer's clue…";}
}

/* ============================== TICK ============================== */
let tickN=0;
setInterval(()=>{
  if(++tickN%20===0)updateOnline();
  const t=S.team;if(!t||t.round.phase!=="answer")return;
  updateDynamic(t);const r=t.round;const rem=remaining(r);
  if(rem<=0&&!S.answers[S.uid]&&S._autoSent!==r.id){S._autoSent=r.id;
    const inp=$("#ans");const lead=r.leader===S.uid;
    if(r.terrain==="traverse")submit({list:S.local.items.concat(inp&&inp.value.trim()?[inp.value.trim()]:[])});
    else if(r.terrain==="crevasse"){const n=parseFloat(String(inp?.value||"").replace(",","."));submit(isFinite(n)?{num:n}:{num:null});}
    else if(r.terrain==="overhang"){if(lead)submit({choice:-1});}
    else submit({text:inp?.value.trim()||""});}
  const all=requiredIds(t).every(id=>S.answers[id]);
  // the round's leader judges; the partner steps in if the leader is away or slow
  const mine=r.leader===S.uid||!t.members[r.leader]||!S.online.has(r.leader)||rem<=-10;
  if((all||rem<=-2)&&mine&&Date.now()-(S._lastTry||0)>2500){S._lastTry=Date.now();tryResolve();}
},500);

/* ============================== SCENE ============================== */
/* The climb is painted on a <canvas>: we watch the rope team from behind on the face of a huge sandstone
   pillar, with the valley and distant ranges opening up on the left and the light warming from morning to
   sunset as they gain height. World units: x across the face, y = 0 at the base-camp meadow and negative
   going up (WK per metre); holds sit every HS units of height along the route.
   Static rock is painted once into cached chunks; sky, light, haze, people, rope and fire are drawn per frame.
   Climbers are small procedural rigs with 2-bone IK limbs: hands move hold to hold, the body follows on a
   spring and the feet step when they fall behind. Event animations play off round.result, so both partners
   see the same climb. */
const WK=1.6,HS=32,CHK=256,X0=100,XW=1150,SX=555;
const WY=a=>-(a-ALT.base)*WK,TOPY=WY(ALT.top);
const IDX_C1=Math.round(-WY(ALT.c1)/HS),IDX_C2=Math.round(-WY(ALT.c2)/HS),IDX_TOP=Math.round(-TOPY/HS);
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const FX={cv:null,g:null,W:1,H:1,dpr:1,rs:1.5,raf:0,last:0,time:0,dt:0,ch:{main:0,rival:0},tw:[],A:null,exp:null,mode:"",state:null,
  cam:null,camW:640,focus:"me",shake:0,parts:[],chunks:new Map(),lit:{c1:1,c2:1},litAt:{},rope:null,pins:[],visible:true,
  birds:[],nextBird:2,wisps:[],nextWisp:1,motes:[],spr:null,label:null,sun:[0,0]};
const DEMO={choice:["A","A"]};

/* ---------- small maths ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,smooth=k=>k*k*(3-2*k);
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function noise1(x){const i=Math.floor(x);return lerp(hash(i,7),hash(i+1,7),smooth(x-i));}
const fbm=x=>noise1(x)*.55+noise1(x*2.1+11)*.28+noise1(x*4.3+23)*.17;
const ridge=(x,sd)=>{const r=1-Math.abs(noise1(x*1.9+sd*1.3)*2-1);return fbm(x+sd)*.55+r*r*.45;};
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hexA=h=>{const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255];};
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixC=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));

const wait=(ms,ch)=>play(ms,()=>{},ch);
const sceneHtml=label=>`<div class="scene"><canvas id="topo" role="img" aria-label="${esc(label)}"></canvas><div class="fx" id="fx" aria-hidden="true"></div></div>`;

/* ---------- light: time of day follows altitude (morning at base camp, gold by Camp II, sunset on top) ---------- */
const PAL=[
 {u:0, skyT:"#6fa3c2",skyH:"#f2dcb6",sun:"#fff4d6",haze:"#dbe3db",far3:"#b9cacb",far2:"#97afb6",far1:"#71909c",mid:"#8e939b",lit:"#f2cb9c",rock:"#c99a76",shade:"#6b5e6e",fog:"#efe7d6",tint:"#fff0db"},
 {u:.5,skyT:"#5b8fbc",skyH:"#f7d6a2",sun:"#fff0c4",haze:"#ecdabd",far3:"#c9c4bc",far2:"#a4a7ac",far1:"#7b8594",mid:"#8c8690",lit:"#f6c48d",rock:"#c9946c",shade:"#5f526a",fog:"#f1dcbf",tint:"#ffe2b8"},
 {u:1, skyT:"#3b4b84",skyH:"#ff9c6c",sun:"#ffd59c",haze:"#e8aa93",far3:"#b391a4",far2:"#8d7498",far1:"#655a80",mid:"#6e5c79",lit:"#f8a77b",rock:"#b67a62",shade:"#43395c",fog:"#e3ae9f",tint:"#ffc49e"}]
 .map(p=>{const o={u:p.u};for(const k in p)if(k!=="u")o[k]=hexA(p[k]);return o;});
function palette(u){u=clamp(u,0,1);const a=PAL[u<.5?0:1],b=PAL[u<.5?1:2],t=(u-a.u)/(b.u-a.u),o={};for(const k in a)if(k!=="u")o[k]=mixC(a[k],b[k],t);return o;}
const C0=PAL[0]; // rock is painted in neutral morning colours; the whole frame is graded per altitude afterwards

/* ---------- geometry: the pillar, the route lanes and the holds ---------- */
const uOf=y=>clamp(y/TOPY,0,1),topT=y=>Math.max(0,(uOf(y)-.78)/.22);
const edgeL=y=>250+fbm(y*.004+3)*70+Math.pow(topT(y),1.5)*215;
const edgeR=y=>uOf(y)<.78?2000:1150-Math.pow(topT(y),1.3)*540+fbm(y*.004+9)*40;
const sideW=y=>26+fbm(y*.01+5)*22;
const groundY=x=>3+Math.sin(x*.005)*5+(fbm(x*.008+2)-.5)*12;
const LANE={s0:t=>420+38*Math.sin(Math.PI*2*t),
  A0:t=>420-62*Math.sin(Math.PI*t)+14*Math.sin(Math.PI*3*t),B0:t=>420+92*Math.sin(Math.PI*t)-16*Math.sin(Math.PI*3*t),
  A1:t=>lerp(420,SX,smooth(t))-58*Math.sin(Math.PI*t),B1:t=>lerp(420,SX,smooth(t))+70*Math.sin(Math.PI*t)};
function laneX(ch,y){const a=ALT.base-y/WK;
  if(a<=ALT.c1)return LANE.s0(clamp((a-ALT.base)/(ALT.c1-ALT.base),0,1));
  if(a<=ALT.c2)return LANE[(ch[0]||"A")+"0"]((a-ALT.c1)/(ALT.c2-ALT.c1));
  return LANE[(ch[1]||"A")+"1"](clamp((a-ALT.c2)/(ALT.top-ALT.c2),0,1));}
const holdXY=(ch,i)=>[laneX(ch,-i*HS)+(i%2?13:-13)+(hash(i,3)-.5)*8,-i*HS+(hash(i,5)-.5)*7];
const boltXY=(ch,i)=>[laneX(ch,-i*HS)+(hash(i,11)-.5)*6,-i*HS+12];
const rivX=y=>{const u=uOf(y);return lerp(640+26*Math.sin(u*9),SX+60,smooth(clamp((u-.74)/.26,0,1)));};
const rivHold=i=>[rivX(-i*HS)+(i%2?12:-12),-i*HS+(hash(i,8)-.5)*7];
const idxOf=(exp,p)=>Math.round(-WY(altOf(exp,p))/HS);
const rivIdx=alt=>Math.min(IDX_TOP,Math.round((alt-ALT.base)*WK/HS));
function restSpot(i,m){if(i<=0){const x=m?382:420;return {x,y:groundY(x)};}
  if(i===IDX_C1||i===IDX_C2)return {x:m?452:420,y:-i*HS};if(i>=IDX_TOP)return {x:m?SX+30:SX,y:TOPY};return null;}
function mateIdx(li){if(li<=0||li===IDX_C1||li===IDX_C2||li>=IDX_TOP)return li;return Math.max(li>IDX_C2?IDX_C2:li>IDX_C1?IDX_C1:0,li-5);}
/* ---------- painted rock, cached in chunks ---------- */
function plant(g,x,y,typ,R){
  if(typ<.45){for(let i=0;i<7;i++){const a=-Math.PI/2+(R()-.5)*1.3,l=6+R()*9;g.strokeStyle=i%2?"rgba(122,140,74,.95)":"rgba(88,108,58,.95)";g.lineWidth=1.3;
      g.beginPath();g.moveTo(x+(R()-.5)*6,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5,y+Math.sin(a)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}}
  else if(typ<.75){for(let i=0;i<6;i++){const bx=x+(R()-.5)*16,by=y-R()*7,r=3.5+R()*4;g.fillStyle="#56693f";g.beginPath();g.arc(bx,by,r,0,7);g.fill();
      g.fillStyle="rgba(150,170,96,.8)";g.beginPath();g.arc(bx-r*.3,by-r*.35,r*.55,0,7);g.fill();}}
  else{const len=30+R()*60;g.strokeStyle="rgba(78,98,54,.9)";g.lineWidth=1.3;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+8,y+len*.3,x-8,y+len*.7,x+3,y+len);g.stroke();
    g.fillStyle="#6f8a4a";for(let i=1;i<9;i++){const k=i/9;g.beginPath();g.ellipse(x+Math.sin(k*5)*5+(i%2?3:-3),y+len*k,2.6,1.4,i%2?.5:-.5,0,7);g.fill();}}
}
function paintChunk(ci){
  const c=document.createElement("canvas"),rs=FX.rs,yTop=-(ci+1)*CHK,yBot=-ci*CHK+2;
  c.width=Math.ceil(XW*rs);c.height=Math.ceil((CHK+2)*rs);
  if(yBot<TOPY)return c;
  const g=c.getContext("2d"),C=C0,R=rng(ci*977+13),ys=[];
  g.scale(rs,rs);g.translate(-X0,-yTop);
  for(let y=Math.max(yTop-8,TOPY);y<yBot+12;y+=8)ys.push(y);
  const rx=y=>Math.min(edgeR(y),X0+XW+20);
  const poly=(l,r)=>{const p=new Path2D();p.moveTo(l(ys[0]),ys[0]);for(const y of ys)p.lineTo(l(y),y);for(let i=ys.length-1;i>=0;i--)p.lineTo(r(ys[i]),ys[i]);p.closePath();return p;};
  // the sunlit side of the pillar (sun is off to the left)
  const side=poly(y=>edgeL(y)-sideW(y),edgeL);
  let gr=g.createLinearGradient(200,0,340,0);gr.addColorStop(0,rgb(mixC(C.lit,[255,242,220],.4)));gr.addColorStop(1,rgb(C.lit));g.fillStyle=gr;g.fill(side);
  g.save();g.clip(side);
  for(let k=Math.floor(-yBot/30)-1;k<=Math.ceil(-yTop/30)+1;k++){const y=-k*30+(hash(k,4)-.5)*8;g.strokeStyle=rgb(C.shade,.14);g.lineWidth=1.6;g.beginPath();g.moveTo(180,y);g.lineTo(360,y+(hash(k,6)-.5)*10);g.stroke();}
  g.restore();
  if(ys.some(y=>edgeR(y)<X0+XW)){g.fillStyle=rgb(mixC(C.rock,C.shade,.55));g.fill(poly(rx,y=>rx(y)+sideW(y)*.8));}
  // the face
  const face=poly(edgeL,rx);
  g.fillStyle=rgb(C.rock);g.fill(face);g.save();g.clip(face);
  // faceted planes on a world-aligned jittered grid, so chunks join seamlessly
  const CW=150,CR=118,V=(r,col)=>[X0+col*CW+(hash(r*31+col,1)-.5)*CW*.7+(r&1)*CW*.5,-r*CR+(hash(r*17+col,2)-.5)*CR*.6];
  for(let r=Math.floor(-yBot/CR)-1;r<=Math.ceil(-yTop/CR)+1;r++)for(let col=-1;col<=8;col++){
    const a=V(r,col),b=V(r,col+1),cc=V(r+1,col+1),d=V(r+1,col),tris=hash(r*7+col,3)<.5?[[a,b,cc],[a,cc,d]]:[[a,b,d],[b,cc,d]];
    tris.forEach((tr,k)=>{const sh=hash(r*13+col*5+k,4),col2=rgb(sh<.5?mixC(C.rock,C.shade,(.5-sh)*1.15):mixC(C.rock,C.lit,(sh-.5)*1.3));
      g.fillStyle=g.strokeStyle=col2;g.lineWidth=1;g.beginPath();g.moveTo(tr[0][0],tr[0][1]);g.lineTo(tr[1][0],tr[1][1]);g.lineTo(tr[2][0],tr[2][1]);g.closePath();g.fill();g.stroke();});
    g.lineWidth=2;g.strokeStyle=rgb(C.lit,.24);g.beginPath();g.moveTo(d[0],d[1]);g.lineTo(cc[0],cc[1]);g.stroke();
    g.lineWidth=1.5;g.strokeStyle=rgb(C.shade,.26);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(d[0],d[1]);g.stroke();}
  // sandstone strata
  for(let k=Math.floor(-yBot/46)-1;k<=Math.ceil(-yTop/46)+1;k++){const base=-k*46+(hash(k,9)-.5)*12;g.beginPath();
    for(let x=X0;x<=X0+XW;x+=24){const y=base+Math.sin(x*.013+k*1.7)*5+Math.sin(x*.041+k)*2;x===X0?g.moveTo(x,y):g.lineTo(x,y);}
    g.lineWidth=2.4;g.strokeStyle=rgb(C.shade,.17);g.stroke();g.translate(0,-2.6);g.lineWidth=1.4;g.strokeStyle=rgb(C.lit,.14);g.stroke();g.translate(0,2.6);}
  // small jutting ledges: lit lip, soft shadow beneath
  for(let k=0;k<2;k++)if(R()<.5){const y=yTop+30+R()*(CHK-60),x0=X0+120+R()*700,w=60+R()*160;
    gr=g.createLinearGradient(0,y,0,y+24);gr.addColorStop(0,rgb(C.shade,.38));gr.addColorStop(1,rgb(C.shade,0));g.fillStyle=gr;g.fillRect(x0,y,w,24);
    g.strokeStyle=rgb(C.lit,.65);g.lineWidth=2.6;g.beginPath();g.moveTo(x0,y);g.quadraticCurveTo(x0+w/2,y-3,x0+w,y+1);g.stroke();}
  // cracks
  for(let k=0;k<4;k++){let x=X0+150+R()*800,y=yTop+R()*CHK;g.beginPath();g.moveTo(x,y);for(let j=0;j<6;j++){x+=(R()-.5)*14;y+=8+R()*12;g.lineTo(x,y);}
    g.lineWidth=1.8;g.strokeStyle=rgb(C.shade,.45);g.stroke();g.translate(-1.2,0);g.lineWidth=1;g.strokeStyle=rgb(C.lit,.28);g.stroke();g.translate(1.2,0);}
  for(let k=0;k<520;k++){g.fillStyle=R()<.5?rgb(C.lit,.13):rgb(C.shade,.13);g.fillRect(X0+R()*XW,yTop+R()*CHK,.6+R()*1.4,.6+R()*1.4);}
  // light falls away across the face
  gr=g.createLinearGradient(260,0,X0+XW,0);gr.addColorStop(0,"rgba(255,232,196,.18)");gr.addColorStop(.45,"rgba(255,232,196,0)");gr.addColorStop(1,rgb(C.shade,.24));
  g.fillStyle=gr;g.fillRect(X0,yTop,XW,CHK+2);
  // broad tonal swells (world-aligned noise), so the face reads as big sculpted masses, not wallpaper
  for(let x=X0;x<X0+XW;x+=60)for(let y=Math.floor(yTop/60)*60;y<yBot;y+=60){const n=fbm(x*.0021+y*.0013+40)*.6+fbm(y*.0031-x*.0009+7)*.4-.5;
    g.fillStyle=n<0?rgb(C.shade,Math.min(.3,-n*.7)):rgb(C.lit,Math.min(.22,n*.5));g.fillRect(x,y,60,60);}
  for(let k=0;k<7;k++)plant(g,X0+60+R()*(XW-120),yTop+R()*CHK,R(),R);
  g.restore();
  // warm rim where the sunlit side turns into the face, and plants spilling over the edge
  g.beginPath();ys.forEach((y,i)=>i?g.lineTo(edgeL(y),y):g.moveTo(edgeL(y),y));g.lineWidth=2.4;g.strokeStyle="rgba(255,238,210,.6)";g.stroke();
  for(let k=0;k<2;k++){const y=yTop+R()*CHK;plant(g,edgeL(y)-sideW(y)+2,y,.8+R()*.2,R);}
  return c;
}
function chunk(ci){let c=FX.chunks.get(ci);if(c){FX.chunks.delete(ci);FX.chunks.set(ci,c);return c;}
  c=paintChunk(ci);FX.chunks.set(ci,c);if(FX.chunks.size>18)FX.chunks.delete(FX.chunks.keys().next().value);return c;}
const chunkRange=(vy0,vy1)=>[Math.max(-1,Math.floor(-vy1/CHK)),Math.min(Math.floor(-TOPY/CHK),Math.floor(-vy0/CHK))];

/* ---------- sprites ---------- */
function makeSprites(){
  const sea=document.createElement("canvas");sea.width=1024;sea.height=200;let g=sea.getContext("2d");const R=rng(5);
  for(let i=0;i<80;i++){const x=R()*1024,y=86+R()*64,r=30+R()*70;for(const dx of [-1024,0,1024]){const gr=g.createRadialGradient(x+dx,y,0,x+dx,y,r);
    gr.addColorStop(0,"rgba(255,255,255,.95)");gr.addColorStop(.6,"rgba(255,255,255,.55)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.beginPath();g.arc(x+dx,y,r,0,7);g.fill();}}
  g.fillStyle="rgba(255,255,255,.92)";g.fillRect(0,148,1024,52);
  const puff=document.createElement("canvas");puff.width=puff.height=128;g=puff.getContext("2d");
  let gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.5,"rgba(255,255,255,.5)");gr.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=gr;g.fillRect(0,0,128,128);
  const grain=document.createElement("canvas");grain.width=grain.height=160;g=grain.getContext("2d");const d=g.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);
  return {sea,puff,grain};
}

/* ---------- climbers: procedural rigs, seen from behind ---------- */
const BASE={boot:"#3a2a22",hn:"#2b2b33",pk:"#8c6a49",pkl:"#b08a62",pkd:"#614832",roll:"#6f7f52",rope:"#d9572c",skin:"#e9b48f",glove:"#efe6d4",hair:"#4a3326"};
const LOOK={me:{...BASE,jk:"#c65a3c",jkl:"#e58a5f",jkd:"#8f3a27",pt:"#3d4757",ptd:"#272d39",hat:"#e8c37b",hatd:"#c49a52",sc:"#f1d9a6"},

class Rope{
  constructor(n){this.n=n;this.p=null;this.reset=1;}

      pin.forEach((ix,k)=>{const q=this.p[ix];q.x=path[k][0];q.y=path[k][1];});}}

    for(let i=1;i<p.length-1;i++)g.quadraticCurveTo(p[i].x,p[i].y,(p[i].x+p[i+1].x)/2,(p[i].y+p[i+1].y)/2);g.lineTo(p[p.length-1].x,p[p.length-1].y);

  drawRoute(g,vy0,vy1);
  for(const [k,ix] of [["c1",IDX_C1],["c2",IDX_C2]]){const y=-ix*HS;if(y>vy0-140&&y<vy1+140)drawCamp(g,420,y,t,k);}
  if(vy0<TOPY+160)drawSummit(g,t);
  // haze over the drop below
  screen();const fa=.6*clamp(-c.y/700,0,1);
  if(fa>0){const gr=g.createLinearGradient(0,H*.62,0,H);gr.addColorStop(0,rgb(pal.fog,0));gr.addColorStop(1,rgb(pal.fog,fa));g.fillStyle=gr;g.fillRect(0,H*.62,W,H*.38);}
  world();
  const A=FX.A;
  if(A.rival){A.rival.draw(g,t);if(A.rkind)sign(g,A.rival.N.x,A.rival.N.y-26,RIVALS[A.rkind].name,11);}
  if(FX.label){const i=FX.label.i,x=laneX(FX.exp.choice,-i*HS),y=-i*HS;g.strokeStyle="#5a4636";g.lineWidth=1.4;g.beginPath();g.moveTo(x,y+4);g.lineTo(x,y-22);g.stroke();
    g.fillStyle="#e6b04a";g.beginPath();g.moveTo(x,y-22);g.lineTo(x+15,y-18+Math.sin(t*5)*1.5);g.lineTo(x,y-13);g.closePath();g.fill();
    sign(g,x+19,y-14,FX.label.text,12,"left");}
  FX.rope.draw(g);quickdraws(g);A.mate.draw(g,t);A.me.draw(g,t);
  if(vy1>-260)fireGlow(g,488,groundY(488),t,1);
  for(const [k,ix] of [["c1",IDX_C1],["c2",IDX_C2]]){const y=-ix*HS;if(y>vy0-140&&y<vy1+140)fireGlow(g,486,y-1,t,fireAmt(k));}
  drawParts(g);
  for(const w of FX.wisps){g.globalAlpha=w.a;g.drawImage(FX.spr.puff,w.x-w.r,w.y-w.r*.45,w.r*2,w.r*.9);}g.globalAlpha=1;
  // light, grade and lens
  screen();const [sx,sy]=FX.sun;
  g.globalCompositeOperation="lighter";
  for(let k=0;k<5;k++){const a=.3+k*.14+Math.sin(t*.07+k*1.3)*.03,sp=.022+hash(k,3)*.02,L=W*1.4,gr=g.createLinearGradient(sx,sy,sx+Math.cos(a)*L,sy+Math.sin(a)*L);
    gr.addColorStop(0,rgb(pal.sun,.065));gr.addColorStop(1,rgb(pal.sun,0));g.fillStyle=gr;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+Math.cos(a-sp)*L,sy+Math.sin(a-sp)*L);g.lineTo(sx+Math.cos(a+sp)*L,sy+Math.sin(a+sp)*L);g.closePath();g.fill();}
  for(const m of FX.motes){const x=m.x*W,y=m.y*H,a=(.5+.5*Math.sin(t*1.5+m.p))*.35*clamp(1-Math.hypot(x-sx,y-sy)/(W*.9),0,1);g.fillStyle=rgb(pal.sun,a);g.beginPath();g.arc(x,y,m.s,0,7);g.fill();}
  g.globalCompositeOperation="multiply";g.fillStyle=rgb(pal.tint,.4);g.fillRect(0,0,W,H);
  g.globalCompositeOperation="source-over";
  const vg=g.createRadialGradient(W/2,H*.48,H*.35,W/2,H*.5,H*.98);vg.addColorStop(0,"rgba(30,16,26,0)");vg.addColorStop(1,"rgba(30,16,26,.36)");g.fillStyle=vg;g.fillRect(0,0,W,H);
  if(!FX.grainPat)FX.grainPat=g.createPattern(FX.spr.grain,"repeat");
  g.globalAlpha=.06;g.globalCompositeOperation="overlay";g.fillStyle=FX.grainPat;g.fillRect(0,0,W,H);g.globalAlpha=1;g.globalCompositeOperation="source-over";
  // paint one chunk ahead of the camera while it is idle, so climbing never waits on it
  const [n1,n2]=chunkRange(vy0-CHK,vy1+CHK);for(let ci=n1;ci<=n2;ci++)if(!FX.chunks.has(ci)){chunk(ci);break;}
}

/* ---------- overlays ---------- */
function title(kick,main,sub){const fx=$("#fx");if(!fx)return;fx.querySelectorAll(".tcard").forEach(x=>x.remove());
  const el=document.createElement("div");el.className="tcard";el.innerHTML=`<i>${esc(kick)}</i><b>${esc(main)}</b><small>${esc(sub)}</small>`;fx.appendChild(el);setTimeout(()=>el.remove(),4200);}
function caption(text){const fx=$("#fx");if(!fx)return;fx.querySelectorAll(".cap").forEach(x=>x.remove());
  const el=document.createElement("div");el.className="cap";el.textContent=text;fx.appendChild(el);setTimeout(()=>el.remove(),3000);}

/* ---------- sequences ---------- */
const stepMsFor=n=>clamp(3600/Math.max(n,1),230,460);
function place(r,i){const rs=r.rest(i);if(rs){r.standAt(rs.x,rs.y);r.hi=i;}else r.grab(Math.max(i,2));}
function placeTeam(exp,li){FX.exp=exp;place(FX.A.me,li);place(FX.A.mate,mateIdx(li));FX.rope.reset=1;}
async function climbRig(r,to,ms,id,ch="main"){
  const ok=()=>FX.ch[ch]===id;
  if(to<r.hi)return downRig(r,to,ms,id,ch);
  if(r.mode==="stand"){if(to<=r.hi)return ok();r.reachFrom(r.hi+3,.4);if(!(await wait(440,ch)))return false;}
  while(r.hi<to){r.stepUp(ms/1000*.92);if(!(await wait(ms,ch)))return false;}
  const rs=r.rest(to);
  if(rs&&r.mode==="climb"){r.h.forEach((h,j)=>r.flyHand(h,rs.x+(j?11:-11)*r.s,rs.y-1,.32));if(!(await wait(340,ch)))return false;
    r.mode="stand";r.gx=rs.x;r.gy=rs.y;r.hi=to;if(!(await wait(520,ch)))return false;}
  return ok();
}
async function downRig(r,to,ms,id,ch){const ok=()=>FX.ch[ch]===id,rs=r.rest(to),stop=rs?to+2:to;
  if(r.mode==="stand")r.grab(Math.max(r.hi,stop+1));
  while(r.hi>stop){r.stepDown(ms/1000*.9);if(!(await wait(ms,ch)))return false;}
  if(rs){r.mode="stand";r.gx=rs.x;r.gy=rs.y;r.hi=to;if(!(await wait(520,ch)))return false;}
  return ok();}
async function fallRig(r,anchor,back,id,ch,caught){
  const rs=r.rest(anchor),[ax,ay]=rs?[rs.x,rs.y-40]:r.hold(anchor);
  pebbles(r);r.startFall(ax,ay+(caught?10:0),caught?Math.hypot(r.N.x-ax,r.N.y-ay-10)+16:34);
  if(!(await wait(caught?1500:1900,ch)))return false;
  r.reachFrom(clamp(Math.round(-(r.N.y-33*r.s)/HS),2,IDX_TOP-1),.3);
  if(!(await wait(360,ch)))return false;
  return climbRig(r,back,260,id,ch);
}
function arrive(name,exp,to){title("You reached",name==="summit"?"The summit":name,`${fmt(-(-to*HS)/WK+ALT.base)} m`);FX.A.me.cheer=2.6;}
async function runEvent(exp,o){
  const id=++FX.ch.main,A=FX.A,me=A.me,mate=A.mate,ok=()=>FX.ch.main===id;
  const to=idxOf(exp,typeof o.to==="number"?o.to:exp.pitch),plan=mateIdx(to);
  if(o.fall&&to<me.hi){caption("Off! The rope drops you to your anchor");
    const lower=wait(500).then(r=>r&&mate.hi>plan&&climbRig(mate,plan,240,id)); // the partner lowers off to meet them
    if(!(await fallRig(me,to,to,id,"main",false)))return;await lower;}
  else if(o.fall){caption("Slip — the rope holds");if(!(await fallRig(me,me.hi-1,me.hi,id,"main",true)))return;}
  else if(to>me.hi){const ms=stepMsFor(to-me.hi),follow=wait(700).then(r=>r&&climbRig(mate,plan,ms,id));
    if(!(await climbRig(me,to,ms,id)))return;
    if(o.arrived)arrive(o.arrived,exp,to);else if(o.echo)caption("Echo — a double pitch");
    if(!(await follow))return;if(o.arrived)mate.cheer=1.8;}
  else caption("Holding on");
  if(ok()&&mate.hi!==plan)await climbRig(mate,plan,320,id);
}
async function runRival(a1){const R=FX.A.rival;if(!R)return;const id=++FX.ch.rival,to=rivIdx(a1);
  if(!(await wait(600,"rival")))return;
  if(to<R.hi)await fallRig(R,to,to,id,"rival",false);else if(to>R.hi)await climbRig(R,to,330,id,"rival");}
async function runSummit(t){const id=++FX.ch.main,A=FX.A,won=t.exp.finished==="won";
  if(A.me.mode!=="stand"||A.me.hi<IDX_TOP)placeTeam(t.exp,IDX_TOP);
  title(won?"First to the top":"You made it","The summit",won?`${fmt(ALT.top)} m · ahead of ${RIVALS[t.rival].name}`:`${fmt(ALT.top)} m · second place`);
  A.me.cheer=3;if(!(await wait(500)))return;A.mate.cheer=2.6;}
async function runDemo(){ // lobby: a rope team climbs the whole pillar on a loop
  const id=++FX.ch.main,A=FX.A,ok=()=>FX.ch.main===id,tot=total(DEMO);
  placeTeam(DEMO,0);if(RM.matches)return;
  while(ok()){placeTeam(DEMO,0);FX.cam=null;if(!(await wait(1500)))return;
    for(let p=0;p<tot;p++){const to=idxOf(DEMO,p+1),ms=stepMsFor(to-A.me.hi),f=wait(700).then(r=>r&&climbRig(A.mate,mateIdx(to),ms,id));
      if(!(await climbRig(A.me,to,ms,id)))return;
      if(p===2&&!(await fallRig(A.me,A.me.hi-1,A.me.hi,id,"main",true)))return;
      if(A.me.rest(to))A.me.cheer=2;
      if(!(await f))return;
      if(A.me.rest(to)){A.mate.cheer=1.6;if(!(await wait(2600)))return;}else if(!(await wait(600)))return;}
    if(!(await wait(2500)))return;}}
function snap(exp,t){FX.ch.main++;FX.ch.rival++;const A=FX.A;placeTeam(exp,idxOf(exp,exp.pitch));
  if(A.rival)place(A.rival,rivIdx(exp.rival.alt));if(t.round.phase==="summit"){A.me.cheer=2;A.mate.cheer=2;}FX.cam=null;}

function drawTopo(t){
  if(!ensureScene())return;
  if(!t){setRival(null);FX.focus="me";FX.camW=700;FX.label=null;FX.lit={c1:1,c2:1};FX.litAt={};
    if(FX.mode!=="lobby"){FX.mode="lobby";FX.exp=DEMO;FX.cam=null;runDemo();}return;}
  const exp=t.exp,r=t.round;FX.exp=exp;setRival(t.rival);
  const reached=Math.max(idxOf(exp,exp.pitch),idxOf(exp,exp.anchor));
  for(const [k,ix] of [["c1",IDX_C1],["c2",IDX_C2]]){const on=reached>=ix;if(on&&!FX.lit[k]&&FX.mode==="game")FX.litAt[k]=FX.time+1.6;FX.lit[k]=on;}
  FX.focus=r.phase==="summit"?"summit":"me";FX.camW=r.phase==="camp"?860:r.phase==="summit"?900:640;
  const tot=total(exp),ter=route(exp)[exp.pitch];
  FX.label=r.phase!=="summit"&&exp.pitch<tot&&needsChoice(exp)<0&&ter?{i:idxOf(exp,exp.pitch+1),text:`P${exp.pitch+1} · ${TERRAIN[ter].name}`}:null;
  const st={n:exp.n,pitch:exp.pitch,ralt:exp.rival.alt,res:r.phase==="reveal"?r.resolvedAt:null,phase:r.phase};
  const prev=FX.state;FX.state=st;
  if(FX.mode!=="game"||!prev||prev.n!==st.n){FX.mode="game";FX.litAt={};snap(exp,t);return;}
  if(st.res&&st.res!==prev.res&&r.result)runEvent(exp,r.result);
  else if(st.pitch!==prev.pitch){const id=++FX.ch.main,to=idxOf(exp,st.pitch);climbRig(FX.A.me,to,300,id).then(k=>k&&climbRig(FX.A.mate,mateIdx(to),300,id));}
  if(st.ralt!==prev.ralt)runRival(st.ralt);
  if(st.phase==="summit"&&prev.phase!=="summit")runSummit(t);
}
/* ============================== BOOT ============================== */
if(document.documentElement.hasAttribute("data-embed")&&window.parent!==window){
  let lastH=0;const post=()=>{const h=Math.ceil(document.body.offsetHeight);if(Math.abs(h-lastH)>2){lastH=h;window.parent.postMessage({belayHeight:h},"*");}};
  try{new ResizeObserver(post).observe(document.body);}catch(e){setInterval(post,1000);}
}
$("#homeBtn").onclick=goLobby;
(function boot(){
  S.uid=LS.get("pid",null);
  if(!S.uid){const a="abcdefghijkmnpqrstuvwxyz23456789";S.uid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>a[b%32]).join("");LS.set("pid",S.uid);}
  S.myName=LS.get("name","");S.myTeams=LS.get("teams",[]);
  renderLobby();
  const m=/^#t-([A-Z0-9]{6})$/.exec(location.hash||"");
  if(m)fb.get("teams/"+m[1]).then(v=>{const t=fixTeam(v);
    if(t&&t.members[S.uid])openTeam(m[1]);
    else if(t)renderLobby({code:m[1],name:t.name});
    else toast("That invite link's rope team doesn't exist.");}).catch(()=>toast("Couldn't reach the mountain. Check your connection."));
})();
