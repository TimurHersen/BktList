<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Köln · Bekârlığa Veda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* — Paper & ink — */
    --bg:        #EAE1C8;
    --bg-deep:   #DFD3AF;
    --card:      #FFFCF3;
    --card-soft: #FBF6E7;

    --ink:       #16283D;
    --ink-soft:  #34506B;
    --muted:     #6B7C8C;

    /* — Postcard palette — */
    --blue:      #2C5B7C;
    --blue-dark: #16374F;
    --blue-light:#8FB8D3;
    --blue-pale: #D8E6EE;

    --gold:      #C89B3C;
    --gold-deep: #9C7526;
    --rust:      #B24E30;
    --plum:      #8C6E96;
    --teal:      #4E8B85;
    --rose:      #C98B98;

    --shadow:    0 10px 28px rgba(22,40,61,0.16);
    --shadow-sm: 0 4px 12px rgba(22,40,61,0.14);
    --shadow-lg: 0 16px 40px rgba(22,40,61,0.22);
    --line:      1.5px solid var(--ink);
    --line-soft: 1.5px solid rgba(22,40,61,0.28);

    --radius:      10px;
    --radius-sm:   7px;
    --radius-pill: 999px;

    --font-display: 'Fraunces', Georgia, serif;
    --font-head:    'Space Grotesk', system-ui, sans-serif;
    --font-body:    'Inter', system-ui, sans-serif;
    --font-mono:    'Space Mono', ui-monospace, monospace;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(22,40,61,0.10) 1px, transparent 1px);
    background-size: 16px 16px;
    pointer-events: none;
    z-index: 0;
  }

  .bg-art { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; opacity: .5; }
  .bg-art svg { position: absolute; }

  /* ─── HEADER ─── */
  .header {
    padding: 52px 20px 0;
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .postmark {
    width: 108px;
    height: 108px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 3px dashed var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transform: rotate(-7deg);
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .postmark .pm-top {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue-dark);
  }
  .postmark .pm-icon { font-size: 26px; margin: 2px 0; }
  .postmark .pm-bottom {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--rust);
  }
  .header h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 56px;
    font-weight: 600;
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .header-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .header-rule span { flex: 1; max-width: 64px; height: 1.5px; background: var(--ink); opacity: .55; }
  .header-gem {
    font-size: 10px;
    color: var(--rust);
    flex: none !important;
    letter-spacing: 3px;
    font-family: var(--font-mono);
    font-weight: 700;
  }
  .header-sub {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: var(--font-head);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #save-status {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* ─── TABS (ticket-stub style) ─── */
  .tabs {
    max-width: 600px;
    margin: 0 auto;
    padding: 30px 20px 0;
    position: relative;
    z-index: 1;
  }
  .tab-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 4px 10px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: var(--card);
    border: var(--line-soft);
    border-bottom: 3px solid transparent;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-family: var(--font-head);
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, border-color 0.15s, color 0.15s;
  }
  .tab-btn:hover { transform: translateY(-2px); color: var(--ink); }
  .tab-btn.active {
    background: var(--blue-dark);
    color: var(--card);
    border-color: var(--ink);
    border-bottom: 3px solid var(--gold);
  }

  @media (hover: none) {
    .deletable .del-btn, .deletable .edit-btn { display: flex; }
  }

  /* ─── PANELS ─── */
  .panels {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 20px 100px;
    position: relative;
    z-index: 1;
  }
  .panel { display: none; padding-top: 26px; }
  .panel.active { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .sec-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-bottom: 6px;
    margin-bottom: 16px;
    border-bottom: 1.5px dashed var(--ink);
    width: 100%;
  }
  .divider {
    border: none;
    border-top: 1.5px dashed var(--ink);
    margin: 30px 0;
    opacity: 0.5;
  }
  .tip {
    background: var(--blue-pale);
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.55;
    font-family: var(--font-body);
    font-weight: 500;
  }

  /* ─── DELETABLE WRAPPER ─── */
  .deletable { position: relative; }
  .del-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--rust);
    border: 2px solid var(--ink);
    color: var(--card);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    font-family: var(--font-body);
    box-shadow: var(--shadow-sm);
  }
  .edit-btn {
    position: absolute;
    top: -8px;
    right: 21px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--ink);
    color: var(--ink);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    font-family: var(--font-body);
    box-shadow: var(--shadow-sm);
  }
  .deletable:hover .del-btn,
  .deletable:hover .edit-btn { display: flex; }

  /* ─── EDIT MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(22,40,61,0.55);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: var(--line);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-lg);
  }
  .modal-title {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }

  /* ─── ADD BUTTON ─── */
  .add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 12px 16px;
    background: transparent;
    border: 1.5px dashed var(--ink);
    border-radius: var(--radius);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s, color 0.15s;
  }
  .add-btn:hover { background: var(--card-soft); color: var(--ink); }
  .add-btn-icon { font-size: 16px; font-weight: 700; }

  /* ─── INLINE FORM ─── */
  .add-form {
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 12px;
    display: none;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .add-form.open { display: flex; }
  .form-row { display: flex; gap: 10px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .form-field label {
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .form-field input,
  .form-field textarea,
  .form-field select {
    background: var(--card-soft);
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    color: var(--ink);
    font-size: 14px;
    font-family: var(--font-body);
    font-weight: 500;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    resize: none;
  }
  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus { background: var(--card); border-color: var(--gold-deep); }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .btn-save {
    background: var(--blue-dark);
    border: var(--line);
    color: var(--card);
    font-size: 12px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s;
  }
  .btn-save:hover { transform: translateY(-1px); }
  .btn-save:active { transform: translateY(0); }
  .btn-cancel {
    background: var(--card);
    border: var(--line-soft);
    color: var(--ink);
    font-size: 12px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .btn-cancel:hover { transform: translateY(-1px); }

  /* ─── MOVIES / FİLMLER & DİZİLER ─── */
  .movie-watched {
    opacity: 0.55;
  }
  .movie-watched .tip-name {
    text-decoration: line-through;
  }
  .watched-btn {
    background: var(--card-soft);
    border: 1.5px solid var(--ink);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-head);
    font-weight: 600;
    color: var(--ink-soft);
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .watched-btn:hover { transform: translateY(-1px); }
  .watched-btn.watched { background: var(--teal); color: var(--card); border-color: var(--ink); }

  .cat-film { background: var(--gold);       color: var(--ink); }
  .cat-dizi { background: var(--blue-light); color: var(--ink); }

  /* ─── TBD ─── */
  .tbd {
    margin-top: 32px;
    padding: 18px;
    background: var(--card);
    border: 1.5px dashed var(--ink);
    border-radius: var(--radius);
    text-align: center;
  }
  .tbd p { font-size: 13px; font-family: var(--font-body); font-weight: 600; color: var(--ink); }
  .tbd p + p { margin-top: 4px; font-size: 11px; }

  /* ─── TIPS / ÖNERİLER ─── */
  .tips-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tips-cat-btn {
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
    font-size: 11px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .tips-cat-btn:hover { transform: translateY(-1px); }
  .tips-cat-btn.active { background: var(--blue-dark); color: var(--card); border-color: var(--ink); }

  .tips-list { display: flex; flex-direction: column; gap: 12px; }
  .tip-card {
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    box-shadow: var(--shadow-sm);
  }
  .tip-icon {
    font-size: 22px;
    flex-shrink: 0;
    margin-top: 1px;
    width: 42px;
    height: 42px;
    background: var(--card-soft);
    border: var(--line-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tip-body { flex: 1; min-width: 0; }
  .tip-name { font-size: 15px; font-weight: 600; font-family: var(--font-head); color: var(--ink); margin-bottom: 5px; }
  .tip-meta { font-size: 11px; font-family: var(--font-mono); font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tip-note { font-size: 13px; font-family: var(--font-body); font-weight: 500; color: var(--ink); line-height: 1.55; }

  .cat-badge {
    display: inline-block;
    font-size: 10px;
    font-family: var(--font-body);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    border: 1.5px solid var(--ink);
  }
  .cat-bar { background: var(--gold);       color: var(--ink); }
  .cat-mat { background: var(--teal);       color: var(--card); }
  .cat-sev { background: var(--blue-light); color: var(--ink); }
  .cat-akt { background: var(--rust);       color: var(--card); }
  .cat-kul { background: var(--plum);       color: var(--card); }

  .tip-voted { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .vote-btn {
    background: var(--card-soft);
    border: 1.5px solid var(--ink);
    cursor: pointer;
    font-size: 13px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, background 0.15s;
    padding: 0;
  }
  .vote-btn:hover { transform: scale(1.08); background: var(--gold); }
  .vote-btn.voted { background: var(--gold); }
  .vote-count { font-size: 13px; font-family: var(--font-mono); font-weight: 700; color: var(--ink); min-width: 16px; text-align: center; }

  .tip-card {
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .tip-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  /* ═══════════ PHOTOS / RESİMLER ═══════════ */
  .photo-upload-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .photo-count-pill {
    align-self: flex-start;
    display: inline-block;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    background: var(--ink);
    color: var(--card);
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.08em;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 6px;
  }
  .photo-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    background: var(--card);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .photo-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-tile .del-btn { display: none; }
  .photo-tile:hover .del-btn { display: flex; }
  @media (hover: none) {
    .photo-tile .del-btn { display: flex; }
  }
  .photo-pending {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1.5px dashed var(--ink);
    border-radius: var(--radius-sm);
    background: var(--card-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .photo-pending::before {
    content: '';
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--ink);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo-empty {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    border: 1.5px dashed var(--ink);
    border-radius: var(--radius);
    background: var(--card-soft);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .photo-empty .ce { font-size: 34px; display: block; margin-bottom: 8px; }

  /* ─── SLIDESHOW LIGHTBOX ─── */
  .slideshow {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(22, 40, 61, 0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .slideshow.open { display: flex; }
  .slideshow-counter {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    background: var(--card);
    color: var(--ink);
    border: var(--line);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.1em;
    z-index: 2;
    box-shadow: var(--shadow-sm);
  }
  .slideshow-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--rust);
    border: var(--line);
    color: var(--card);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
  }
  .slideshow-stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    max-height: calc(100vh - 160px);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slideshow-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border: var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    background: var(--card);

  }

    bottom: 0;

    z-index: 1;

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* Firebase Realtime Database — bktlist project */
const DB_URL = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/data.json';
const PHOTOS_URL = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/photos.json';
const PHOTO_BASE = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/photos';

let _editCtx = null;

let movies = [], tips = [];
let photos = []; // [{ id (firebase key), data (base64), uploaded (ts) }]
let _moviesFilter = 'hepsi';

function showStatus(msg, ok = true) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = ok ? '#16374F' : '#B24E30';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

async function saveToCloud() {
  showStatus('Kaydediliyor…');
  try {
    const res = await fetch(DB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ movies, tips })
    });
    if (!res.ok) throw new Error();
    await res.json();
    writeCache({ movies, tips });
    showStatus('Kaydedildi ✓');
  } catch(e) {
    showStatus('Kayıt başarısız ✗', false);
  }
}

/* ── renderers ── */

const MOVIE_TYPE_LABELS = { film: 'Film', dizi: 'Dizi' };
const MOVIE_TYPE_CSS    = { film: 'cat-film', dizi: 'cat-dizi' };
const MOVIE_TYPE_ICON   = { film: '🎬', dizi: '📺' };

function renderMovies() {
  const el = document.getElementById('movies-list');
  const filtered = _moviesFilter === 'hepsi' ? movies : movies.filter(m => m.type === _moviesFilter);
  if (!filtered.length) {
    el.innerHTML = `<div style="padding:32px 0;text-align:center;font-size:13px;font-family:'Inter',sans-serif;font-weight:600;color:#6B7C8C">Henüz film/dizi önerisi yok — bir tane ekle! 🍿</div>`;
    return;
  }
  el.innerHTML = filtered.map(m => `
    <div class="tip-card deletable${m.watched ? ' movie-watched' : ''}">
      <button class="edit-btn" onclick="openEdit('movies',${m.id})">✎</button>
      <button class="del-btn" onclick="deleteItem('movies',${m.id})">×</button>
      <div class="tip-icon">${m.emoji || MOVIE_TYPE_ICON[m.type] || '🎬'}</div>
      <div class="tip-body">
        <div class="tip-name">${m.title}</div>
        <div class="tip-meta">
          <span class="cat-badge ${MOVIE_TYPE_CSS[m.type] || 'cat-film'}">${MOVIE_TYPE_LABELS[m.type] || m.type}</span>
        </div>
        ${m.note ? `<div class="tip-note">${m.note}</div>` : ''}
      </div>
      <div class="tip-voted">
        <button class="watched-btn${m.watched ? ' watched' : ''}" onclick="toggleWatched(${m.id})">${m.watched ? '✓ İzlendi' : 'İzlenecek'}</button>
        <button class="vote-btn${(m.votes||0) > 0 ? ' voted' : ''}" onclick="voteMovie(${m.id})">👍</button>
        <span class="vote-count">${m.votes || 0}</span>
      </div>
    </div>`).join('');
}

function filterMovies(type) {
  _moviesFilter = type;
  document.querySelectorAll('#tab-movies .tips-cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().includes(type === 'hepsi' ? 'Hepsi' : MOVIE_TYPE_LABELS[type] || type));
  });
  renderMovies();
}

function voteMovie(id) {
  movies = movies.map(m => m.id === id ? { ...m, votes: (m.votes || 0) + 1 } : m);
  renderMovies();
  saveToCloud();
}

function toggleWatched(id) {
  movies = movies.map(m => m.id === id ? { ...m, watched: !m.watched } : m);
  renderMovies();
  saveToCloud();
}

function addMovie() {
  const emoji = document.getElementById('mf-emoji').value.trim();

const CAT_LABELS = { bar:'Bar', mat:'Yemek', sev:'Gezilecek Yer', akt:'Aktivite', kul:'Eğlenceli' };
const CAT_CSS    = { bar:'cat-bar', mat:'cat-mat', sev:'cat-sev', akt:'cat-akt', kul:'cat-kul' };
let _tipsFilter = 'alla';

function renderTips() {
  const el = document.getElementById('tips-list');
  const filtered = _tipsFilter === 'alla' ? tips : tips.filter(t => t.cat === _tipsFilter);
  if (!filtered.length) {
    el.innerHTML = `<div style="padding:32px 0;text-align:center;font-size:13px;font-family:'Inter',sans-serif;font-weight:600;color:#6B7C8C">Henüz öneri yok — bir tane ekle! 🚀</div>`;
    return;
  }
  el.innerHTML = filtered.map(t => `
    <div class="tip-card deletable">
      <button class="edit-btn" onclick="openEdit('tips',${t.id})">✎</button>
      <button class="del-btn" onclick="deleteItem('tips',${t.id})">×</button>
      <div class="tip-icon">${t.emoji || '📍'}</div>
      <div class="tip-body">
        <div class="tip-name">${t.name}</div>
        <div class="tip-meta">
          <span class="cat-badge ${CAT_CSS[t.cat] || 'cat-kul'}">${CAT_LABELS[t.cat] || t.cat}</span>
          ${t.area ? `<span>${t.area}</span>` : ''}
        </div>
        ${t.note ? `<div class="tip-note">${t.note}</div>` : ''}
      </div>
      <div class="tip-voted">
        <button class="vote-btn${(t.votes||0) > 0 ? ' voted' : ''}" onclick="voteTip(${t.id})">👍</button>
        <span class="vote-count">${t.votes || 0}</span>
      </div>
    </div>`).join('');
}

function filterTips(cat) {
  _tipsFilter = cat;
  document.querySelectorAll('#tab-tips .tips-cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().includes(cat === 'alla' ? 'Hepsi' : CAT_LABELS[cat] || cat));
  });
  renderTips();
}

function voteTip(id) {
  tips = tips.map(t => t.id === id ? { ...t, votes: (t.votes || 0) + 1 } : t);
  renderTips();
  saveToCloud();
}


/* ══════════════ PHOTOS ══════════════ */

let _pendingUploads = 0;

function renderPhotos() {
  const grid = document.getElementById('photo-grid');
  const countEl = document.getElementById('photo-count');
  const sorted = [...photos].sort((a, b) => (b.uploaded || 0) - (a.uploaded || 0));
  countEl.textContent = sorted.length + ' resim';

  let html = '';
  for (let i = 0; i < _pendingUploads; i++) {
    html += `<div class="photo-pending">Yükleniyor…</div>`;
  }
  if (sorted.length === 0 && _pendingUploads === 0) {
    html = `<div class="photo-empty">
              <span class="ce">📷</span>
              Henüz resim yok. Butona bas ve ilk anıları yükle!
            </div>`;
  } else {
    html += sorted.map((p, idx) => `
      <div class="photo-tile deletable" onclick="openSlideshow(${idx})">
        <button class="del-btn" onclick="event.stopPropagation();deletePhoto('${p.id}')">×</button>
        <img src="${p.data}" alt="" loading="lazy">
      </div>
    `).join('');
  }
  grid.innerHTML = html;
}

/* Compress an image file → JPEG dataURL. Keeps EXIF orientation
   because modern browsers respect it when drawing to canvas. */
function compressImage(file, maxDim = 1400, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load failed — try JPG/PNG'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(ev) {
  const files = Array.from(ev.target.files || []);
  ev.target.value = ''; // reset so same file can be picked again
  if (!files.length) return;

  switchTab('photos');

  _pendingUploads = files.length;
  renderPhotos();
  showStatus(files.length + ' resim yükleniyor…');

  let successCount = 0;
  for (const file of files) {
    try {
      if (!file.type.startsWith('image/')) {
        console.warn('Skipping non-image file:', file.name);
        _pendingUploads--;
        renderPhotos();
        continue;
      }
      const dataUrl = await compressImage(file);
      const payload = { data: dataUrl, uploaded: Date.now(), name: file.name };
      const res = await fetch(PHOTOS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error();
      const { name: firebaseId } = await res.json();
      photos.push({ id: firebaseId, ...payload });
      successCount++;
      _pendingUploads--;
      renderPhotos();
    } catch(err) {
      _pendingUploads--;
      console.error('Upload failed for', file.name, err);
      renderPhotos();
    }
  }

  if (successCount === files.length) {
    showStatus('Yüklendi ✓');
  } else if (successCount > 0) {
    showStatus(successCount + '/' + files.length + ' yüklendi', false);
  } else {
    showStatus('Yükleme başarısız ✗', false);
  }
}

async function deletePhoto(id) {
  const idx = photos.findIndex(p => p.id === id);
  if (idx === -1) return;
  const removed = photos.splice(idx, 1)[0];
  renderPhotos();
  try {
    const res = await fetch(`${PHOTO_BASE}/${id}.json`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    showStatus('Silindi ✓');
  } catch(e) {
    photos.splice(idx, 0, removed);
    renderPhotos();
    showStatus('Silinemedi ✗', false);
  }
}

/* ── Slideshow ── */
let _slideIdx = 0;
let _autoplayTimer = null;

function getSlideshowList() {
  return [...photos].sort((a, b) => (b.uploaded || 0) - (a.uploaded || 0));
}

function openSlideshow(idx) {
  const list = getSlideshowList();
  if (!list.length) return;
  _slideIdx = idx;
  document.getElementById('slideshow').classList.add('open');
  document.body.style.overflow = 'hidden';
  showSlide();
}

function closeSlideshow() {
  document.getElementById('slideshow').classList.remove('open');
  document.body.style.overflow = '';
  stopAutoplay();
}

function showSlide() {
  const list = getSlideshowList();
  if (!list.length) { closeSlideshow(); return; }
  if (_slideIdx >= list.length) _slideIdx = 0;
  if (_slideIdx < 0) _slideIdx = list.length - 1;
  const img = document.getElementById('ss-img');
  img.classList.add('fading');
  setTimeout(() => {
    img.src = list[_slideIdx].data;
    img.classList.remove('fading');
  }, 120);
  document.getElementById('ss-counter').textContent = (_slideIdx + 1) + ' / ' + list.length;
}

function nextSlide() { _slideIdx++; showSlide(); }
function prevSlide() { _slideIdx--; showSlide(); }

function toggleAutoplay() {
  const btn = document.getElementById('ss-play');
  if (_autoplayTimer) {
    stopAutoplay();
  } else {
    _autoplayTimer = setInterval(nextSlide, 3500);
    btn.classList.add('playing');
    btn.textContent = '❚❚';
  }
}
function stopAutoplay() {
  if (_autoplayTimer) clearInterval(_autoplayTimer);
  _autoplayTimer = null;
  const btn = document.getElementById('ss-play');
  btn.classList.remove('playing');
  btn.textContent = '▶';
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('slideshow').classList.contains('open')) return;
  if (e.key === 'ArrowRight') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
  else if (e.key === 'Escape') closeSlideshow();
  else if (e.key === ' ') { e.preventDefault(); toggleAutoplay(); }
});

(function setupSwipe() {
  const stage = document.querySelector('.slideshow-stage');
  if (!stage) return;
  let startX = 0, startY = 0, tracking = false;
  stage.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextSlide(); else prevSlide();
    }
  }, { passive: true });
})();

async function loadPhotos() {
  try {
    const res = await fetch(PHOTOS_URL);
    const data = await res.json();
    if (data && typeof data === 'object') {
      photos = Object.entries(data).map(([id, p]) => ({ id, ...p }));
    } else {
      photos = [];
    }
    renderPhotos();
  } catch(e) {
    renderPhotos();
  }
}

function openEdit(list, id) {
  _editCtx = { list, id };
  const fields = document.getElementById('edit-modal-fields');
  const titles = { movies: 'Film/diziyi düzenle', tips: 'Öneriyi düzenle' };
  document.getElementById('edit-modal-title').textContent = titles[list] || 'Düzenle';

  let item;
  if (list === 'movies') item = movies.find(x => x.id === id);
  else if (list === 'tips') item = tips.find(x => x.id === id);

  if (list === 'movies') {
    const types = ['film','dizi'];
    fields.innerHTML = `
      <div class="form-row">
        <div class="form-field" style="max-width:70px"><label>Emoji</label><input id="ef-emoji" value="${item.emoji||''}"></div>
        <div class="form-field"><label>İsim</label><input id="ef-title" value="${item.title}"></div>
      </div>
      <div class="form-field"><label>Tür</label>
        <select id="ef-type">${types.map(t => `<option value="${t}"${item.type===t?' selected':''}>${MOVIE_TYPE_LABELS[t]}</option>`).join('')}</select>
      </div>
      <div class="form-field"><label>Not</label><textarea id="ef-desc" rows="2">${item.note||''}</textarea></div>`;
  } else if (list === 'tips') {
    const cats = ['bar','mat','sev','akt','kul'];
    fields.innerHTML = `
      <div class="form-row">
        <div class="form-field" style="max-width:70px"><label>Emoji</label><input id="ef-emoji" value="${item.emoji||''}"></div>
        <div class="form-field"><label>İsim</label><input id="ef-title" value="${item.name}"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Kategori</label>
          <select id="ef-cat">${cats.map(c => `<option value="${c}"${item.cat===c?' selected':''}>${CAT_LABELS[c]}</option>`).join('')}</select>
        </div>
        <div class="form-field"><label>Bölge</label><input id="ef-area" value="${item.area||''}"></div>
      </div>
      <div class="form-field"><label>Not</label><textarea id="ef-desc" rows="2">${item.note||''}</textarea></div>`;
  }

  document.getElementById('edit-modal').classList.add('open');
  fields.querySelector('input, textarea')?.focus();
}

function closeEdit() {
  document.getElementById('edit-modal').classList.remove('open');
  _editCtx = null;
}

function saveEdit() {
  if (!_editCtx) return;
  const { list, id } = _editCtx;
  const get = i => document.getElementById(i)?.value.trim() ?? '';

  function patch(arr) {
    return arr.map(x => {
      if (x.id !== id) return x;
      if (list === 'movies') return { ...x, emoji: get('ef-emoji') || x.emoji, title: get('ef-title') || x.title, type: get('ef-type') || x.type, note: get('ef-desc') };
      if (list === 'tips') return { ...x, emoji: get('ef-emoji') || x.emoji, name: get('ef-title') || x.name, cat: get('ef-cat') || x.cat, area: get('ef-area'), note: get('ef-desc') };
      return x;
    });
  }

  if (list === 'movies') { movies = patch(movies); renderMovies(); }
  else if (list === 'tips') { tips = patch(tips); renderTips(); }

  closeEdit();
  saveToCloud();
}

function deleteItem(list, id) {
  if (list === 'movies') { movies = movies.filter(x => x.id !== id); renderMovies(); }
  else if (list === 'tips') { tips = tips.filter(x => x.id !== id); renderTips(); }
  saveToCloud();
}

function switchTab(id) {
  const tabIds = ['movies','tips','photos','sos'];
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', tabIds[i] === id);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.id === 'tab-' + id);
  });
  if (id === 'sos' && _sosMap) {
    setTimeout(() => _sosMap.invalidateSize(), 60);
  }
}

/* ══════════════ BORTTAPPAD / SOS ══════════════ */

const SOS_EMAIL = 'timurhersen2@gmail.com';
const SOS_FORMSUBMIT_URL = 'https://formsubmit.co/ajax/' + SOS_EMAIL;
let _sosMap = null;
let _sosMarker = null;
let _sosCoords = null;

function setSosStatus(msg, kind) {
  const el = document.getElementById('sos-status');
  el.innerHTML = msg || '';
  el.className = 'sos-status' + (kind ? ' ' + kind : '');
}

function initSosMap(lat, lng) {
  const wrap = document.getElementById('sos-map-wrap');
  wrap.classList.add('shown');
  if (typeof L === 'undefined') {
    setSosStatus('⚠️ Harita kütüphanesi yüklenemedi. İnterneti kontrol edip tekrar dene.', 'err');
    return;
  }
  if (!_sosMap) {
    _sosMap = L.map('sos-map', { zoomControl: true }).setView([lat, lng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(_sosMap);
    _sosMarker = L.marker([lat, lng], { draggable: true }).addTo(_sosMap);
    _sosMarker.on('dragend', (e) => {
      const p = e.target.getLatLng();
      _sosCoords = { lat: p.lat, lng: p.lng };
      updateSosCoordsLabel();
    });
    _sosMap.on('click', (e) => {
      _sosMarker.setLatLng(e.latlng);
      _sosCoords = { lat: e.latlng.lat, lng: e.latlng.lng };
      updateSosCoordsLabel();
    });
  } else {
    _sosMap.setView([lat, lng], 16);
    _sosMarker.setLatLng([lat, lng]);
  }
  _sosCoords = { lat, lng };
  updateSosCoordsLabel();
  document.getElementById('sos-send-btn').disabled = false;
  setTimeout(() => _sosMap.invalidateSize(), 100);
}

function updateSosCoordsLabel() {
  const el = document.getElementById('sos-coords');
  if (!_sosCoords) return;
  el.classList.add('shown');
  el.innerHTML = `📍 ${_sosCoords.lat.toFixed(5)}, ${_sosCoords.lng.toFixed(5)}<span class="hint">Ayarlamak için haritayı sürükle veya dokun</span>`;
}

function getMyLocation() {
  const btn = document.getElementById('sos-locate-btn');
  const txt = document.getElementById('sos-locate-text');
  if (!navigator.geolocation) {
    setSosStatus('❌ Tarayıcın konum verisini desteklemiyor.', 'err');
    return;
  }
  btn.disabled = true;
  txt.textContent = 'Konum alınıyor…';
  setSosStatus('📡 Konumun alınıyor…');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      txt.textContent = 'Konumumu güncelle';
      setSosStatus('');
      initSosMap(pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      btn.disabled = false;
      txt.textContent = 'Konumumu al';
      let msg = '❌ Konum alınamadı. ';
      if (err.code === 1) msg += 'Erişimi reddettin — tarayıcıda konum iznini aç.';
      else if (err.code === 2) msg += 'Konum mevcut değil.';
      else if (err.code === 3) msg += 'Zaman aşımına uğradı.';
      else msg += err.message;
      setSosStatus(msg, 'err');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function buildMailtoFallback(name, phone, mapsLink, coordsStr, timestamp) {
  const body = `${name} Köln'de kayıp!\n\nTelefon: ${phone}\nKonum: ${coordsStr}\nGoogle Maps: ${mapsLink}\nZaman: ${timestamp}`;
  return 'mailto:' + SOS_EMAIL +
         '?subject=' + encodeURIComponent('🆘 ' + name + ' kayıp!') +
         '&body=' + encodeURIComponent(body);
}

async function sendSOS() {
  const name = document.getElementById('sos-name').value.trim();
  const phone = document.getElementById('sos-phone').value.trim();
  if (!name)  { setSosStatus('⚠️ Adını gir.', 'err'); return; }
  if (!phone) { setSosStatus('⚠️ Telefon numaranı gir.', 'err'); return; }
  if (!_sosCoords) { setSosStatus('⚠️ Önce konumunu al.', 'err'); return; }

  try {
    localStorage.setItem('sos_name', name);
    localStorage.setItem('sos_phone', phone);
  } catch(e) {}

  const btn = document.getElementById('sos-send-btn');
  btn.disabled = true;
  setSosStatus('📤 SOS gönderiliyor…');

  const coordsStr = _sosCoords.lat.toFixed(6) + ', ' + _sosCoords.lng.toFixed(6);
  const mapsLink = 'https://www.google.com/maps?q=' + _sosCoords.lat + ',' + _sosCoords.lng;
  const timestamp = new Date().toLocaleString('tr-TR');
  const mailtoLink = buildMailtoFallback(name, phone, mapsLink, coordsStr, timestamp);

  const payload = {
    İsim: name,
    Telefon: phone,
    Konum: coordsStr,
    'Google Maps': mapsLink,
    Zaman: timestamp,
    _subject: '🆘 ' + name + ' Köln\'de kayıp!',
    _captcha: 'false',
    _template: 'table'
  };

  try {
    const res = await fetch(SOS_FORMSUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const json = await res.json().catch(() => ({}));
    const okFlag = json.success === 'true' || json.success === true;
    if (res.ok && okFlag) {
      setSosStatus(
        '✅ <strong>SOS gönderildi!</strong> Timur konumunu aldı.<br>' +
        '<a href="' + mapsLink + '" target="_blank" rel="noopener">Google Maps\'te aç</a>',
        'ok'
      );
      btn.textContent = '✅ Gönderildi';
    } else {
      throw new Error(json.message || 'Tjänsten svarade inte OK');
    }
  } catch(err) {
    setSosStatus(
      '❌ Otomatik gönderilemedi. ' +
      '<a href="' + mailtoLink + '">E-postayı manuel aç →</a>',
      'err'
    );
    btn.disabled = false;
  }
}

function loadSosFromCache() {
  try {
    const name = localStorage.getItem('sos_name');
    const phone = localStorage.getItem('sos_phone');
    if (name)  document.getElementById('sos-name').value  = name;
    if (phone) document.getElementById('sos-phone').value = phone;
  } catch(e) {}
}

const DEFAULT_DATA = {
  movies: [],
  tips: []
};

const CACHE_KEY = 'bktlist_cache_v2';

function loadCache() {
  try { const v = localStorage.getItem(CACHE_KEY); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function writeCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {}
}

function applyData(d) {
  movies = d.movies ? d.movies : DEFAULT_DATA.movies;
  tips   = d.tips   ? d.tips   : DEFAULT_DATA.tips;
  renderMovies();
  renderTips();
}

const cached = loadCache();
if (cached) {
  applyData(cached);
}

fetch(DB_URL)
  .then(r => r.json())
  .then(d => {
    const seeded = !d;
    if (seeded) {
      applyData(DEFAULT_DATA);
      writeCache(DEFAULT_DATA);
      saveToCloud();
    } else {
      applyData(d);
      writeCache(d);
    }
  })
  .catch(err => {
    if (!cached) applyData(DEFAULT_DATA);
    showStatus('Çevrimdışı — değişiklikler kaydedilmeyecek', false);
  });

renderPhotos();
loadPhotos();

loadSosFromCache();
</script>
