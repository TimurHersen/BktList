<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BktList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: "Orbit Lounge Wonk";
    src: url("OrbitLoungeWonk-Regular.woff2") format("woff2"),
         url("OrbitLoungeWonk-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    /* — Deco night — */
    --bg:        #17140F;
    --bg-deep:   #0F0D0A;
    --card:      #221E17;
    --card-soft: #2B261D;

    --ink:       #EFE6D5;
    --ink-soft:  #C9BFA9;
    --muted:     #8A8378;

    /* — Gold & accents — */
    --gold:       #C9A24D;
    --gold-deep:  #9C7A2E;
    --gold-light: #E3C77A;
    --rose:       #E69FB5;
    --rose-deep:  #C97690;
    --jade:       #5E9C8D;
    --jade-deep:  #457468;
    --mint:       #6FBFA8;

    --shadow:    0 14px 36px rgba(0,0,0,0.5);
    --shadow-sm: 0 6px 16px rgba(0,0,0,0.45);
    --shadow-lg: 0 20px 50px rgba(0,0,0,0.6);
    --line:      1.5px solid var(--gold);
    --line-soft: 1px solid rgba(201,162,77,0.32);

    --radius:      3px;
    --radius-sm:   2px;
    --radius-pill: 999px;

    --font-display: "Orbit Lounge Wonk", serif;
    --font-script:  'Alex Brush', cursive;
    --font-head:    'Space Grotesk', system-ui, sans-serif;
    --font-body:    'Inter', system-ui, sans-serif;
    --font-mono:    'Space Mono', ui-monospace, monospace;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 400;
    overflow-x: hidden;
  }

  /* ═══════════ DARK DECO NIGHT SKY ═══════════ */
  /* Gradient sky: deep indigo up top, violet mid, warm ember glow at the horizon */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(201,110,45,0.30) 0%, rgba(201,110,45,0) 60%),
      radial-gradient(ellipse 90% 60% at 50% 88%, rgba(140,60,110,0.28) 0%, rgba(140,60,110,0) 65%),
      linear-gradient(180deg, #090A16 0%, #12122B 32%, #241A3D 58%, #3A2145 76%, #14101C 100%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-art { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-art svg { position: absolute; }

  /* Moon — slow drift */
  .deco-moon {
    right: 12%;
    top: 6%;
    width: min(170px, 34vw);
    height: min(170px, 34vw);
    animation: moonDrift 34s ease-in-out infinite alternate;
  }
  @keyframes moonDrift {
    from { transform: translate(0, 0); }
    to   { transform: translate(-16px, 14px); }
  }

  /* Sunburst rays radiating from behind the moon */
  .deco-rays {
    right: 4%;
    top: -2%;
    width: min(340px, 68vw);
    height: min(340px, 68vw);
    transform-origin: 50% 50%;
    animation: raysTurn 90s linear infinite;
    opacity: .5;
  }
  @keyframes raysTurn {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Skyline layers pinned to the bottom */
  .deco-skyline {
    left: 0;
    bottom: 0;
    width: 100%;
    height: auto;
  }
  .deco-skyline.far  { opacity: .40; }
  .deco-skyline.mid  { opacity: .62; }
  .deco-skyline.near { opacity: .92; }

  /* Windows flicker on at staggered intervals */
  .win {
    animation: winGlow 7s ease-in-out infinite;
    transform-box: fill-box;
  }
  @keyframes winGlow {
    0%, 100% { opacity: .28; }
    45%      { opacity: 1; }
  }

  /* Twinkling stars */
  .twinkle { animation: twinkle 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  /* Corner deco fans — gentle breathing */
  .deco-fan { animation: fanBreathe 12s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes fanBreathe {
    0%, 100% { opacity: .30; }
    50%      { opacity: .58; }
  }

  @media (prefers-reduced-motion: reduce) {
    .deco-moon, .deco-rays, .win, .twinkle, .deco-fan { animation: none !important; }
  }

  /* ─── HEADER ─── */
  .header {
    padding: 58px 20px 0;
    max-width: 860px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  .header-inner {
    position: relative;
  }
  .header-brand {
    min-width: 0;
    text-align: center;
  }
  .header-cocktail {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 220px;
    height: 169px;
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 68px;
    font-weight: 400;
    line-height: 0.9;
    color: var(--ink);
    letter-spacing: 0.04em;
    margin: 0 0 6px;
    text-shadow: 0 2px 0 var(--gold-deep);
  }
  .wordmark span { display: inline-block; }
  .header-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 14px 0 12px;
  }
  .header-gem {
    font-size: 11px;
    color: var(--rose);
    letter-spacing: 4px;
    font-family: var(--font-mono);
    font-weight: 700;
  }
  #save-status {
    display: block;
    margin-top: 12px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--gold-light);
    opacity: 0;
    transition: opacity 0.4s;
  }

  /* ─── TABS ─── */
  .tabs {
    max-width: 600px;
    margin: 0 auto;
    padding: 32px 20px 0;
    position: relative;
    z-index: 1;
  }
  .tab-bar {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 6px 28px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 4px 10px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 22px;
    font-family: var(--font-script);
    font-weight: 400;
    letter-spacing: 0.02em;
    padding: 6px 4px 8px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    text-decoration: underline;
    text-decoration-color: transparent;
    text-underline-offset: 6px;
    text-decoration-thickness: 1.5px;
    transition: transform 0.12s, text-decoration-color 0.15s, color 0.15s;
  }
  .tab-btn:hover { transform: translateY(-1px); text-decoration-color: var(--gold-light); }
  .tab-btn.active {
    color: var(--ink);
    text-decoration-color: var(--gold);
  }

  @media (hover: none) {
    .deletable .del-btn, .deletable .edit-btn { display: flex; }
  }

  /* ─── PANELS ─── */
  .panels {
    max-width: 600px;
    margin: 0 auto;
    padding: 0 20px 100px;
    position: relative;
    z-index: 1;
  }
  .panel { display: none; padding-top: 26px; }
  .panel.active { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .sec-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-light);
    padding-bottom: 8px;
    margin-bottom: 18px;
    border-bottom: 1px solid rgba(201,162,77,0.35);
    width: 100%;
  }
  .divider {
    border: none;
    height: 2px;
    margin: 30px 0;
    opacity: 0.6;
    background: repeating-linear-gradient(135deg, var(--gold) 0 5px, transparent 5px 10px);
  }
  .tip {
    background: var(--card-soft);
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--ink);
    line-height: 1.55;
    font-family: var(--font-body);
    font-weight: 500;
  }

  /* ─── DELETABLE WRAPPER ─── */
  .deletable { position: relative; }
  .del-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--rose-deep);
    border: 2px solid var(--bg);
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    font-family: var(--font-body);
    box-shadow: var(--shadow-sm);
  }
  .edit-btn {
    position: absolute;
    top: -8px;
    right: 21px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--gold);
    border: 2px solid var(--bg);
    color: var(--bg-deep);
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    font-family: var(--font-body);
    box-shadow: var(--shadow-sm);
  }
  .deletable:hover .del-btn,
  .deletable:hover .edit-btn { display: flex; }

  /* ─── EDIT MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,13,10,0.78);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border: var(--line);
    border-radius: var(--radius);
    padding: 22px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-lg);
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 4px;
  }

  /* ─── ADD BUTTON ─── */
  .add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
    padding: 12px 16px;
    background: transparent;
    border: 1.5px dashed rgba(201,162,77,0.5);
    border-radius: var(--radius);
    color: var(--gold-light);
    font-size: 12px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .add-btn:hover { background: var(--card-soft); color: var(--ink); border-color: var(--gold); }
  .add-btn-icon { font-size: 16px; font-weight: 700; }

  /* ─── INLINE FORM ─── */
  .add-form {
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 12px;
    display: none;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .add-form.open { display: flex; }
  .form-row { display: flex; gap: 10px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .form-field label {
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-light);
  }
  .form-field input,
  .form-field textarea,
  .form-field select {
    background: var(--bg-deep);
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    color: var(--ink);
    font-size: 14px;
    font-family: var(--font-body);
    font-weight: 500;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
    resize: none;
  }
  .form-field input::placeholder,
  .form-field textarea::placeholder { color: var(--muted); }
  .form-field input:focus,
  .form-field textarea:focus,
  .form-field select:focus { border-color: var(--gold); }
  .form-field select option { background: var(--bg-deep); color: var(--ink); }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .btn-save {
    background: var(--gold);
    border: 1.5px solid var(--gold);
    color: var(--bg-deep);
    font-size: 12px;
    font-family: var(--font-head);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s;
  }
  .btn-save:hover { transform: translateY(-1px); }
  .btn-save:active { transform: translateY(0); }
  .btn-cancel {
    background: transparent;
    border: var(--line-soft);
    color: var(--ink-soft);
    font-size: 12px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 9px 18px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: transform 0.1s, border-color .15s;
  }
  .btn-cancel:hover { transform: translateY(-1px); border-color: var(--gold); }

  /* ─── MOVIES / FİLMLER & DİZİLER ─── */
  .movie-watched {
    opacity: 0.5;
  }
  .movie-watched .tip-name {
    text-decoration: line-through;
  }
  .watched-btn {
    background: var(--card-soft);
    border: 1.5px solid rgba(201,162,77,0.4);
    cursor: pointer;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-head);
    font-weight: 600;
    color: var(--ink-soft);
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .watched-btn:hover { transform: translateY(-1px); }
  .watched-btn.watched { background: var(--jade); color: var(--bg-deep); border-color: var(--jade); }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius-pill);
    color: var(--ink);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 16px;
    cursor: pointer;
    margin-bottom: 18px;
    transition: transform 0.1s, border-color 0.15s;
  }
  .filter-btn:hover { transform: translateY(-1px); border-color: var(--gold); }
  .filter-badge {
    background: var(--gold);
    color: var(--bg-deep);
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 2px;
  }

  .cat-film { background: var(--gold);  color: var(--bg-deep); }
  .cat-dizi { background: var(--rose);  color: var(--bg-deep); }

  .imdb-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: #F5C518;
    color: #1A1A1A;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }
  .tip-genre {
    font-size: 11px;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-weight: 500;
  }
  .tip-poster {
    width: 74px;
    height: 106px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    border: var(--line-soft);
    flex-shrink: 0;
  }
  .imdb-link {
    color: var(--gold-light);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .omdb-status {
    font-size: 12px;
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--ink-soft);
    min-height: 16px;
  }
  .omdb-status.err { color: var(--rose); }
  .omdb-status.ok { color: var(--mint); }
  .omdb-preview {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--bg-deep);
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 10px;
  }
  .omdb-preview img {
    width: 52px;
    height: 76px;
    object-fit: cover;
    border-radius: var(--radius-sm);
    flex-shrink: 0;
  }
  .omdb-preview-body { flex: 1; min-width: 0; }
  .omdb-preview-title { font-family: var(--font-head); font-weight: 600; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .omdb-preview-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .omdb-preview-clear {
    background: none;
    border: none;
    color: var(--rose);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  /* ─── TIPS / ÖNERİLER ─── */
  .tips-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .tips-cat-btn {
    background: var(--card);
    border: var(--line-soft);
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
    font-size: 11px;
    font-family: var(--font-head);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 5px 14px;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s, color 0.15s;
  }
  .tips-cat-btn:hover { transform: translateY(-1px); }
  .tips-cat-btn.active { background: var(--gold); color: var(--bg-deep); border-color: var(--gold); }

  .tips-list { display: flex; flex-direction: column; gap: 12px; }
  .tip-card {
    background: rgba(34, 30, 23, 0.86);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: var(--line-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s, box-shadow 0.1s, border-color .15s;
  }
  .tip-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: rgba(201,162,77,0.5);
  }
  .tip-icon {
    font-size: 22px;
    flex-shrink: 0;
    margin-top: 1px;
    width: 42px;
    height: 42px;
    background: var(--bg-deep);
    border: var(--line-soft);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tip-body { flex: 1; min-width: 0; }
  .tip-name { font-size: 15px; font-weight: 600; font-family: var(--font-head); color: var(--ink); margin-bottom: 5px; }
  .tip-meta { font-size: 11px; font-family: var(--font-mono); font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tip-note { font-size: 13px; font-family: var(--font-body); font-weight: 500; color: var(--ink-soft); line-height: 1.55; }

  .cat-badge {
    display: inline-block;
    font-size: 10px;
    font-family: var(--font-body);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
  }
  .cat-bar { background: var(--gold-light); color: var(--bg-deep); }
  .cat-mat { background: var(--jade);       color: var(--bg-deep); }
  .cat-sev { background: var(--rose);       color: var(--bg-deep); }
  .cat-akt { background: var(--gold-deep);  color: var(--ink); }
  .cat-kul { background: var(--rose-deep);  color: var(--ink); }

  .tip-voted { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .vote-btn {
    background: var(--card-soft);
    border: 1.5px solid rgba(201,162,77,0.4);
    cursor: pointer;
    font-size: 13px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, background 0.15s;
    padding: 0;
  }
  .vote-btn:hover { transform: scale(1.08); background: var(--gold); }
  .vote-btn.voted { background: var(--gold); }
  .vote-count { font-size: 13px; font-family: var(--font-mono); font-weight: 700; color: var(--gold-light); min-width: 16px; text-align: center; }

  /* ═══════════ PHOTOS / RESİMLER ═══════════ */
  .photo-upload-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }
  .photo-count-pill {
    align-self: flex-start;
    display: inline-block;
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 700;
    background: var(--gold);
    color: var(--bg-deep);
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.08em;
  }
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 6px;
  }
  .photo-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    border: var(--line-soft);
    border-radius: var(--radius-sm);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    background: var(--card);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .photo-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-tile .del-btn { display: none; }
  .photo-tile:hover .del-btn { display: flex; }
  @media (hover: none) {
    .photo-tile .del-btn { display: flex; }
  }
  .photo-pending {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1.5px dashed rgba(201,162,77,0.5);
    border-radius: var(--radius-sm);
    background: var(--card-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .photo-pending::before {
    content: '';
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--gold);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .photo-empty {
    grid-column: 1 / -1;
    padding: 40px 20px;
    text-align: center;
    border: 1.5px dashed rgba(201,162,77,0.5);
    border-radius: var(--radius);
    background: var(--card-soft);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .photo-empty .ce { font-size: 34px; display: block; margin-bottom: 8px; }

  /* ─── SLIDESHOW LIGHTBOX ─── */
  .slideshow {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10, 8, 6, 0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .slideshow.open { display: flex; }
  .slideshow-counter {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    background: var(--card);
    color: var(--ink);
    border: var(--line);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    letter-spacing: 0.1em;
    z-index: 2;
    box-shadow: var(--shadow-sm);
  }
  .slideshow-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--rose-deep);
    border: var(--line);
    color: var(--ink);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
  }
  .slideshow-stage {
    position: relative;
    width: 100%;
    max-width: 720px;
    max-height: calc(100vh - 160px);
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slideshow-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border: var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    background: var(--card);
    transition: opacity 0.25s;
  }
  .slideshow-img.fading { opacity: 0; }
  .slideshow-tap {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 40%;
    cursor: pointer;
    z-index: 1;
  }
  .slideshow-tap.left { left: 0; }
  .slideshow-tap.right { right: 0; }
  .slideshow-controls {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2;
  }
  .ss-btn {
    background: var(--card);
    border: var(--line);
    color: var(--ink);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-body);
    transition: transform 0.1s;
  }
  .ss-btn:hover { transform: translateY(-1px); }
  .ss-btn.play { background: var(--gold); color: var(--bg-deep); }
  .ss-btn.play.playing { background: var(--jade); color: var(--bg-deep); }

  @media (max-width: 820px) {
    .header-cocktail { width: 110px; height: 85px; }
    .wordmark { font-size: 44px; }
  }

  @media (max-width: 480px) {
    .header { padding: 42px 16px 0; }
    .header-cocktail { width: 80px; height: 62px; }
    .wordmark { font-size: 34px; margin-top: 0; }
    .tabs { padding: 22px 14px 0; }
    .tab-bar { gap: 4px 16px; }
    .tab-btn { padding: 6px 4px 8px; font-size: 15px; }
    .panels { padding: 0 14px 80px; }
    .sec-label { font-size: 10px; }
    .tips-cats { gap: 6px; }
    .tips-cat-btn { font-size: 10px; padding: 4px 10px; }
    .tip-card { padding: 12px; gap: 10px; }
    .tip-icon { font-size: 19px; width: 36px; height: 36px; }
    .tip-poster { width: 58px; height: 83px; }
    .form-row { gap: 8px; }
    .add-form { padding: 12px; }
    .modal { padding: 16px; }
    .modal-title { font-size: 20px; }
    .photo-grid { gap: 8px; }
    .slideshow { padding: 12px; }
    .slideshow-close { width: 36px; height: 36px; font-size: 17px; top: 14px; right: 14px; }
    .slideshow-counter { top: 14px; font-size: 10px; padding: 5px 12px; }
    .ss-btn { width: 42px; height: 42px; font-size: 18px; }
  }
  @media (max-width: 360px) {
    .header-cocktail { width: 66px; height: 51px; }
    .wordmark { font-size: 28px; }
  }
</style>
</head>

<script>
/* Firebase Realtime Database — bktlist project */
const DB_URL = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/data.json';
const PHOTOS_URL = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/photos.json';
const PHOTO_BASE = 'https://bktlist-97058-default-rtdb.europe-west1.firebasedatabase.app/photos';

/* OMDb API — used to pull IMDb rating/genre/poster for the movie watchlist.
   Get a free key at https://www.omdbapi.com/apikey.aspx (instant, 1,000 requests/day)
   and paste it below. Without a real key the "IMDb'den bilgi çek" lookup will fail
   but everything else on the site still works fine. */
const OMDB_API_KEY = 'eb1d40f3';

let _editCtx = null;
let _mfOmdbData = null; // holds fetched IMDb info for the movie currently being added

let movies = [], tips = [];
let photos = []; // [{ id (firebase key), data (base64), uploaded (ts) }]
let _moviesFilter = 'hepsi';
let _moviesStatusFilter = 'hepsi'; // 'hepsi' | 'izlenecek' | 'izlendi'
let _moviesGenreFilters = new Set(); // empty set = all genres

const GENRE_TR = {
  'Action': 'Aksiyon', 'Adventure': 'Macera', 'Animation': 'Animasyon',
  'Biography': 'Biyografi', 'Comedy': 'Komedi', 'Crime': 'Suç',
  'Documentary': 'Belgesel', 'Drama': 'Dram', 'Family': 'Aile',
  'Fantasy': 'Fantastik', 'Film-Noir': 'Film Noir', 'Game-Show': 'Yarışma',
  'History': 'Tarih', 'Horror': 'Korku', 'Music': 'Müzik', 'Musical': 'Müzikal',
  'Mystery': 'Gizem', 'News': 'Haber', 'Reality-TV': 'Reality TV',
  'Romance': 'Romantik', 'Sci-Fi': 'Bilim Kurgu', 'Short': 'Kısa Film',
  'Sport': 'Spor', 'Talk-Show': 'Talk Show', 'Thriller': 'Gerilim',
  'War': 'Savaş', 'Western': 'Vahşi Batı'
};
function genreLabel(g) { return GENRE_TR[g] || g; }
function splitGenres(genreStr) {
  return (genreStr || '').split(',').map(g => g.trim()).filter(Boolean);
}

function showStatus(msg, ok = true) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = ok ? '#16374F' : '#B24E30';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

async function saveToCloud() {
  showStatus('Kaydediliyor…');
  try {
    const res = await fetch(DB_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ movies, tips })
    });
    if (!res.ok) throw new Error();
    await res.json();
    writeCache({ movies, tips });
    showStatus('Kaydedildi ✓');
  } catch(e) {
    showStatus('Kayıt başarısız ✗', false);
  }
}

/* ── renderers ── */

const MOVIE_TYPE_LABELS = { film: 'Film', dizi: 'Dizi' };
const MOVIE_TYPE_CSS    = { film: 'cat-film', dizi: 'cat-dizi' };
const MOVIE_TYPE_ICON   = { film: '🎬', dizi: '📺' };

function renderMovies() {
  const el = document.getElementById('movies-list');
  const filtered = movies.filter(m => {
    const typeOk = _moviesFilter === 'hepsi' || m.type === _moviesFilter;
    const statusOk = _moviesStatusFilter === 'hepsi' || (_moviesStatusFilter === 'izlendi' ? !!m.watched : !m.watched);
    const genreOk = _moviesGenreFilters.size === 0 || splitGenres(m.genre).some(g => _moviesGenreFilters.has(g));
    return typeOk && statusOk && genreOk;
  });
  updateMoviesFilterBadge();
  if (!filtered.length) {
    const msg = movies.length
      ? 'Bu filtreye uyan film/dizi yok.'
      : 'Henüz film/dizi önerisi yok — bir tane ekle! 🍿';
    el.innerHTML = `<div style="padding:32px 0;text-align:center;font-size:13px;font-family:'Inter',sans-serif;font-weight:600;color:#6B7C8C">${msg}</div>`;
    return;
  }
  el.innerHTML = filtered.map(m => `
    <div class="tip-card deletable${m.watched ? ' movie-watched' : ''}">
      <button class="edit-btn" onclick="openEdit('movies',${m.id})">✎</button>
      <button class="del-btn" onclick="deleteItem('movies',${m.id})">×</button>
      ${m.poster

async function fetchOmdbInfo(title, year) {
  let url = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(title)}`;
  if (year) url += `&y=${encodeURIComponent(year)}`;

  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    throw new Error('Ağa ulaşılamadı: ' + e.message);
  }

  let data = null;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error('Sunucu geçersiz yanıt verdi (HTTP ' + res.status + ')');
  }

  if (!res.ok || data.Response === 'False') {
    throw new Error(data.Error || ('HTTP ' + res.status));
  }
  return data;
}

/* Compress an image file → JPEG dataURL. Keeps EXIF orientation
   because modern browsers respect it when drawing to canvas. */
function compressImage(file, maxDim = 1400, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load failed — try JPG/PNG'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(ev) {
  const files = Array.from(ev.target.files || []);
  ev.target.value = ''; // reset so same file can be picked again
  if (!files.length) return;

  switchTab('photos');

  _pendingUploads = files.length;
  renderPhotos();
  showStatus(files.length + ' resim yükleniyor…');

  let successCount = 0;
  for (const file of files) {
    try {
      if (!file.type.startsWith('image/')) {
        console.warn('Skipping non-image file:', file.name);
        _pendingUploads--;
        renderPhotos();
        continue;
      }
      const dataUrl = await compressImage(file);
      const payload = { data: dataUrl, uploaded: Date.now(), name: file.name };
      const res = await fetch(PHOTOS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error();
      const { name: firebaseId } = await res.json();
      photos.push({ id: firebaseId, ...payload });
      successCount++;
      _pendingUploads--;
      renderPhotos();
    } catch(err) {
      _pendingUploads--;
      console.error('Upload failed for', file.name, err);
      renderPhotos();
    }
  }

  if (successCount === files.length) {
    showStatus('Yüklendi ✓');
  } else if (successCount > 0) {
    showStatus(successCount + '/' + files.length + ' yüklendi', false);
  } else {
    showStatus('Yükleme başarısız ✗', false);
  }
}

async function deletePhoto(id) {
  const idx = photos.findIndex(p => p.id === id);
  if (idx === -1) return;
  const removed = photos.splice(idx, 1)[0];
  renderPhotos();
  try {
    const res = await fetch(`${PHOTO_BASE}/${id}.json`, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    showStatus('Silindi ✓');
  } catch(e) {
    photos.splice(idx, 0, removed);
    renderPhotos();
    showStatus('Silinemedi ✗', false);
  }
}

/* ── Slideshow ── */
let _slideIdx = 0;
let _autoplayTimer = null;

function getSlideshowList() {
  return [...photos].sort((a, b) => (b.uploaded || 0) - (a.uploaded || 0));
}

function openSlideshow(idx) {
  const list = getSlideshowList();
  if (!list.length) return;
  _slideIdx = idx;
  document.getElementById('slideshow').classList.add('open');
  document.body.style.overflow = 'hidden';
  showSlide();
}

function closeSlideshow() {
  document.getElementById('slideshow').classList.remove('open');
  document.body.style.overflow = '';
  stopAutoplay();
}

function showSlide() {
  const list = getSlideshowList();
  if (!list.length) { closeSlideshow(); return; }
  if (_slideIdx >= list.length) _slideIdx = 0;
  if (_slideIdx < 0) _slideIdx = list.length - 1;
  const img = document.getElementById('ss-img');
  img.classList.add('fading');
  setTimeout(() => {
    img.src = list[_slideIdx].data;
    img.classList.remove('fading');
  }, 120);
  document.getElementById('ss-counter').textContent = (_slideIdx + 1) + ' / ' + list.length;
}

function nextSlide() { _slideIdx++; showSlide(); }
function prevSlide() { _slideIdx--; showSlide(); }

function toggleAutoplay() {
  const btn = document.getElementById('ss-play');
  if (_autoplayTimer) {
    stopAutoplay();
  } else {
    _autoplayTimer = setInterval(nextSlide, 3500);
    btn.classList.add('playing');
    btn.textContent = '❚❚';
  }
}
function stopAutoplay() {
  if (_autoplayTimer) clearInterval(_autoplayTimer);
  _autoplayTimer = null;
  const btn = document.getElementById('ss-play');
  btn.classList.remove('playing');
  btn.textContent = '▶';
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('slideshow').classList.contains('open')) return;
  if (e.key === 'ArrowRight') nextSlide();
  else if (e.key === 'ArrowLeft') prevSlide();
  else if (e.key === 'Escape') closeSlideshow();
  else if (e.key === ' ') { e.preventDefault(); toggleAutoplay(); }
});

(function setupSwipe() {
  const stage = document.querySelector('.slideshow-stage');
  if (!stage) return;
  let startX = 0, startY = 0, tracking = false;
  stage.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; tracking = true;
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextSlide(); else prevSlide();
    }
  }, { passive: true });
})();

function saveEdit() {
  if (!_editCtx) return;
  const { list, id } = _editCtx;
  const get = i => document.getElementById(i)?.value.trim() ?? '';

  function patch(arr) {
    return arr.map(x => {
      if (x.id !== id) return x;
      if (list === 'movies') return { ...x, emoji: get('ef-emoji') || x.emoji, title: get('ef-title') || x.title, type: get('ef-type') || x.type, note: get('ef-desc') };
      if (list === 'tips') return { ...x, emoji: get('ef-emoji') || x.emoji, name: get('ef-title') || x.name, cat: get('ef-cat') || x.cat, area: get('ef-area'), note: get('ef-desc') };
      return x;
    });
  }

  if (list === 'movies') { movies = patch(movies); renderMovies(); }
  else if (list === 'tips') { tips = patch(tips); renderTips(); }

  closeEdit();
  saveToCloud();
}

function deleteItem(list, id) {
  if (list === 'movies') { movies = movies.filter(x => x.id !== id); renderMovies(); }
  else if (list === 'tips') { tips = tips.filter(x => x.id !== id); renderTips(); }
  saveToCloud();
}

  renderMovies();
  renderTips();
}

const cached = loadCache();
if (cached) {
  applyData(cached);
}

fetch(DB_URL)
  .then(r => r.json())
  .then(d => {
    const seeded = !d;
    if (seeded) {
      applyData(DEFAULT_DATA);
      writeCache(DEFAULT_DATA);
      saveToCloud();
    } else {
      applyData(d);
      writeCache(d);
    }
  })
  .catch(err => {
    if (!cached) applyData(DEFAULT_DATA);
    showStatus('Çevrimdışı — değişiklikler kaydedilmeyecek', false);
  });

renderPhotos();
loadPhotos();

wobblify('.wobble');
</script>
</body>
</html>
